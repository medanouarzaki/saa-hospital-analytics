  # ----------------------------------------------------------- type d'épisode
  # L'article 36 du règlement intérieur établit une taxonomie réglementaire des
  # modes d'utilisation de l'hôpital SANS L'ÉNUMÉRER. Que ces trois codes se
  # lisent immédiatement comme hospitalisation, consultation et urgences est une
  # ressemblance, non une source.
