# Registre des libellés de dimension — un libellé par code, aucun libellé sans source citée
#
# RÈGLE DE PREUVE. Un code ne reçoit un libellé que si une source du registre des
# sources (`docs/sources/sources.yml`) établit la correspondance, et cette source est
# citée ici par son identifiant et par le renvoi précis qui la porte. Un code dont
# aucune source n'établit la signification figure ici aussi, sans libellé, avec le
# motif : un registre qui ne porterait que les codes documentés laisserait croire à
# l'exhaustivité.
#
# CE QUE LA RÈGLE DU CADRAGE INTERDIT, ET CE QU'ELLE N'INTERDIT PAS. L'interdiction
# d'inventer un libellé porte sur les VALEURS DE CODE VENUES DU SYSTÈME OBSERVÉ : on ne
# décide pas que tel code signifie tel service si rien ne l'établit. Elle n'interdit pas
# d'afficher un libellé qu'une source documentée donne, avec sa référence.
#
# LES DEUX GARDE-FOUS QUI ONT SERVI À CLASSER.
#   - Une correspondance plausible n'est pas une correspondance documentée. Qu'un code
#     ressemble à l'abréviation d'un mot ne l'établit pas.
#   - Les décomptes doivent concorder. Si une source décrit trois groupes et que les
#     données en portent cinq, la correspondance n'est pas établie.
#
# `categorie` prend deux valeurs et deux seulement :
#   - `documente` : une source établit la correspondance ; `source` et `renvoi` sont
#     renseignés, `libelle` l'est aussi.
#   - `non_documente` : aucune source ne l'établit ; `libelle` est absent et `motif` dit
#     pourquoi. Le code s'affiche nu.
#
# Une source décrivant la nomenclature sans établir la correspondance exacte du code
# relève de `non_documente` : c'est le cas des niveaux de tri, dont la source ne
# distingue que trois groupes de gravité là où les données portent cinq niveaux.

decompte:
  codes: 28
  documentes: 13
  non_documentes: 15

libelles:

  # --------------------------------------------------------------- activité
