parametres:
- nom: age_maximal_revolus_pediatrie
  valeur: 15
  unite: ans revolus, age maximal a la date d'admission pour une eligibilite a l'unite HPED
  provenance: HYP
  preuve: sans_preuve_externe
  note: 'Le document de cadrage borne la pediatrie a quinze ans
    revolus, une contrainte dure sans source propre citee (posee comme regle d''eligibilite,
    pas comme mesure). Applique par generator/mouvements.py au tirage de l''unite
    d''admission (et de la destination d''une mutation) : un patient de plus de quinze ans
    revolus a la date d''admission n''est jamais eligible a HPED, le poids de
    repartition_unites_hospitalisation restreint et renormalise aux seules unites eligibles
    avant tirage. Mesure avant d''ecrire : 596 admissions HPED sur 806
    (73,9 %) portaient un patient de plus de quinze ans avant ce parametre, faute de tout controle.
    Si ce seuil etait faux, la frontiere entre patients eligibles et non eligibles a HPED
    serait faussee, sans effet sur le nombre total de sejours ni sur les autres unites.'
- nom: repartition_unites_hospitalisation
  valeur:
    HM: 0.55
    HPED: 0.25
    HGO: 0.2
  unite: proportion par code de nomenclature_service (unites d'hospitalisation non chirurgicales)
  provenance: HYP
  preuve: sans_preuve_externe
  note: 'Repartition des admissions entre les trois unites d''hospitalisation non
    chirurgicales de nomenclature_service (HM, HPED, HGO - voir
    generator/config/nomenclatures_organisation_activite.yml pour leur justification une a
    une). HM domine, plausible pour une unite regroupant medecine generale, medecine
    interne et cardiologie face a deux unites plus specialisees. Posee sans source. Lue
    aussi par generator/urgences.py pour la colonne service_orientation des passages
    orientes vers l''hospitalisation (HO), les deux modules dessinant independamment un
    meme phenomene, comme deja pratique entre generator/passages.py et
    generator/mouvements.py - cette colonne descriptive reste hors du perimetre des deux
    contraintes dures ci-dessous, faute d''acces au sexe et a l''age du patient a l''endroit
    ou elle est ecrite (generator/urgences.py ne recoit pas la table des patients).

    generator/mouvements.py restreint desormais ce tirage aux unites eligibles pour le
    patient admis avant application des poids ci-dessus, renormalises sur le sous-ensemble
    eligible : HGO (gyneco-obstetrique) n''admet que des patientes (sexe F), contrainte dure
    du document de cadrage, sans exception ; HPED (pediatrie) n''admet que des patients d''au
    plus age_maximal_revolus_pediatrie ans a la date d''admission, meme source. Si cette
    repartition etait fausse, la charge relative affichee par unite serait faussee, sans
    effet sur le nombre total de sejours ni sur la capacite de chaque unite.'
- nom: capacite_par_unite
  valeur:
    HM: 22
    HPED: 10
    HGO: 8
  unite: lits par unite d'hospitalisation
  provenance: HYP
  preuve: sans_preuve_externe
  note: Repartition de la capacite litiere fonctionnelle totale (40 lits, DOC, S-30,
    generator/config/volumetrie.yml, lue, non modifiee) entre les trois unites, dans le
    meme ordre de grandeur que repartition_unites_hospitalisation. Posee sans source ;
    la somme (40) doit toujours egaler capacite_litiere_fonctionnelle, verifie par le
    test generique et par tests/test_mouvements.py. Si cette repartition etait fausse,
    l'occupation maximale affichee par unite serait faussee, sans effet sur l'occupation
    totale de l'etablissement, qui reste bornee par la capacite totale.
- nom: repartition_mode_sortie
  valeur:
    R: 0.85
    I: 0.05
    D: 0.1
  unite: proportion par code de nomenclature_mode_sortie
  provenance: HYP
  preuve: sans_preuve_externe
  note: Aucune source ne documente la repartition des sorties (reguliere avec billet,
    a l'insu du personnel, deces - articles 79/80 du reglement interieur) pour cet
    etablissement. Posee sans source, une sortie reguliere dominant tres largement. Si
    cette repartition etait fausse, la mortalite hospitaliere affichee serait faussee,
    sans effet sur le nombre de sejours clos.
- nom: part_sejours_avec_mutation
  valeur: 0.2
  unite: proportion des sejours
  provenance: HYP
  preuve: sans_preuve_externe
  note: Part des sejours qui changent de lit une fois en cours de sejour, posee sans
    source. Si ce taux etait faux, le nombre de lignes de mutation serait faux, sans effet
    sur le nombre de sejours ni sur les journees d'hospitalisation totales.
- nom: ecart_type_log_duree_sejour
  valeur: 0.5
  unite: ecart-type du logarithme de la duree de sejour
  provenance: HYP
  preuve: sans_preuve_externe
  note: Meme construction que ecart_type_log_duree (generator/config/passages.yml) et
    ecart_type_log_delai_par_specialite (generator/config/rendez_vous.yml) - ecart-type pose
    sans source,
    la moyenne (pas la mediane) de la loi log-normale est ajustee pour reproduire la duree
    moyenne de sejour mesuree (journees d'hospitalisation publiees / admissions fixees,
    voir le rapport), pas une valeur posee independamment.
- nom: gabarit_identifiant_sejour
  valeur: SEJ-{rang:07d}
  unite: gabarit de formatage
  provenance: HYP
  preuve: sans_preuve_externe
  note: Gabarit interprete par le generateur a partir du rang d'apparition du passage
    d'hospitalisation correspondant, jamais ecrit en dur ailleurs. Choix technique, non
    observe.
- nom: gabarit_identifiant_mouvement
  valeur: MVT-{rang:07d}
  unite: gabarit de formatage
  provenance: HYP
  preuve: sans_preuve_externe
  note: Gabarit interprete par le generateur a partir du rang d'apparition de la ligne de
    mouvement (une valeur par ligne, admission, mutation ou sortie confondues - le meme
    principe de numerotation generale que le registre des champs decrit a l'article 35 du
    reglement interieur, sans distinguer les mutations des autres mouvements). Choix
    technique, non observe.
- nom: gabarit_identifiant_lit
  valeur: "LIT-{unite}-{rang:03d}"
  unite: gabarit de formatage
  provenance: HYP
  preuve: sans_preuve_externe
  note: Gabarit interprete par le generateur a partir du code de l'unite d'hospitalisation
    et du rang du lit dans le pool propre a cette unite, dont la taille est
    capacite_par_unite. Le code d'unite fait partie de l'identifiant depuis que la
    capacite litiere totale (generator/config/volumetrie.yml, lue, non modifiee) est
    repartie entre plusieurs unites - deux unites distinctes ne partagent aucun rang de
    lit, chaque pool etant numerote independamment a partir de 1. Choix technique, non
    observe.
