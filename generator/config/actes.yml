  unite: couples code-libellé, plus lettre clé, coefficient et rattachement
  provenance: HYP
  preuve: S-17
  note: 'La structure — un acte identifié par un code, rémunéré par une lettre clé et un coefficient,
    rattaché à l''activité ou au service qui le pratique — est celle du système national dont S-17 donne
    la grille des lettres clés (contenu lu). Le détail acte par acte (quel examen, quel coefficient précis)
    n''est corroboré par aucune source ouverte et reste posé : coefficients choisis dans l''ordre de
    grandeur usuel de la nomenclature marocaine pour des actes de biologie et d''imagerie courants, sans
    valeur individuelle vérifiée. Aucun acte chirurgical, aucun examen de bactériologie, de parasitologie
    ni d''hygiène alimentaire : les trois catégories mesurées à zéro (examens_bacteriologie,
    examens_parasitologie, examens_hygiene_alimentaire) et l''absence mesurée d''interventions
    chirurgicales (interventions_chirurgicales) n''ont aucun acte correspondant. Le laboratoire porte six
    actes par catégorie mesurée non nulle (immuno-sérologie, hématologie-transfusion, chimie biologie),
    pour qu''une table des lignes de facture répartissant des dizaines de milliers d''examens sur ces
    catégories ne les concentre pas sur une poignée de codes. Si un coefficient individuel était faux, le
    montant absolu des lignes portant cet acte serait faussé, sans effet sur le nombre d''actes par
    catégorie ni sur les totaux mesurés par ailleurs.
    Un trente-troisième acte, HOSP-J, porte la lettre J ajoutée à la tarification (décision posée,
    documentée dans sa propre note) : un acte par journée d''hospitalisation, coefficient 1. Son
    rattachement de nomenclature (service HM) est générique, la table des lignes de facture portant par
    ailleurs sa propre colonne service_executant, renseignée avec l''unité réelle du séjour (HM, HPED ou
    HGO) pour chaque ligne engendrée.
    Un trente-quatrième acte, CONS-UR, porte la consultation aux urgences elle-même : lettre Cs
    (consultation spécialiste), déjà documentée par S-17, aucune lettre nouvelle requise. Coefficient posé
    à 1,5, supérieur au coefficient 1 des consultations programmées des huit spécialités : une prise en
    charge aux urgences mobilise davantage de ressources (tri, actes de surveillance non détaillés en
    ligne séparée, disponibilité continue) qu''une consultation programmée, sans qu''aucune source ne
    chiffre l''écart exact. Rattachement au service UR (déjà présent dans nomenclature_service), pas à une
    activité : aucune des huit spécialités de nomenclature_activite ne couvre la médecine d''urgence en
    tant que telle. Si ce coefficient était faux, le montant absolu des lignes de consultation aux
    urgences serait faussé, sans effet sur le nombre de passages facturés ni sur les autres actes.'
