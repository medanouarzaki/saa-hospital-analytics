  - nom: passages_urgences_par_jour
    valeur: 30
    unite: passages par jour
    provenance: HYP
    preuve: sans_preuve_externe
    note: >-
      Scénario retenu de l'analyse de sensibilité, entre les bornes 14 et
      54. La borne haute (54) transpose un ratio passages par lit observé à
      l'hôpital Mohamed V, hôpital de recours, à la capacité litière de
      Sidi Said ; cette transposition est contredite par la seule
      description disponible du service, qui n'assurait pas la garde faute
      de généralistes affectés. La borne basse (14) dérive de deux ratios
      non sourcés (part des séjours issus des urgences, taux
      d'hospitalisation aux urgences). La valeur retenue, 30, est
      délibérément placée sous le milieu de la fourchette (34) parce que la
      borne haute repose sur une transposition contredite par la source,
      tandis que la borne basse ne souffre que d'un défaut de sourçage de
      ses ratios : l'asymétrie de la fourchette reflète l'asymétrie de la
      confiance accordée à ses bornes. Si cette hypothèse était fausse,
      c'est tout le dimensionnement de la table des passages aux urgences
      qui serait à l'échelle d'un service différent de celui décrit par les
      sources disponibles.

  - nom: scenarios_passages_urgences
    valeur: [14, 30, 54]
    unite: passages par jour
    provenance: HYP
    preuve: sans_preuve_externe
    note: >-
      Les trois valeurs de l'analyse de sensibilité aux passages aux
      urgences : la borne basse, le scénario retenu et la borne haute,
      décrits au paramètre passages_urgences_par_jour. Si l'une de ces
      bornes était fausse, l'amplitude de l'analyse de sensibilité présentée
      au rapport serait faussée sans que le scénario retenu change
      nécessairement.
