  - nom: ferie_fixe_aid_al_wahda
    valeur: "10-31"
    unite: jour-mois récurrent
    provenance: DOC
    preuve: S-26
    note: >-
      « Aïd Al Wahda le 31 octobre ». Ne s'applique pas avant
      aid_al_wahda_premiere_annee.

  - nom: aid_al_wahda_date_acte
    valeur: "2025-11"
    unite: mois
    provenance: DOC
    preuve: S-26
    note: >-
      « institué par décret royal de novembre 2025 ». Le jour exact du décret
      n'est pas donné par la source, seuls le mois et l'année le sont.

  - nom: aid_al_wahda_premiere_annee
    valeur: 2026
    unite: année
    provenance: DOC
    preuve: S-26
    note: >-
      Dérivé par nécessité logique depuis aid_al_wahda_date_acte : un décret
      de novembre 2025 est postérieur au 31 octobre 2025, donc ce jour-là ne
      peut pas avoir été férié. Le premier 31 octobre qui suit l'acte est
      celui de 2026. Si cette dérivation était fausse, un jour férié serait
      appliqué une année où le décret qui le fonde n'existait pas encore.

  - nom: ramadan_debut_2024
    valeur: "2024-03-11"
    unite: date
    provenance: HYP
    preuve: sans_preuve_externe
    note: >-
      Reprise du document de cadrage, non corroborée par le registre des
      sources qui ne documente que l'exercice 2026. Si cette date était
      fausse, les grandeurs dérivées pour 2024 en seraient faussées.

  - nom: ramadan_fin_2024
    valeur: "2024-04-09"
    unite: date
    provenance: HYP
