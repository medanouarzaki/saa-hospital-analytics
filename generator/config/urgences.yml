parametres:
- nom: repartition_niveaux_tri
  valeur:
    '1': 0.02
    '2': 0.08
    '3': 0.27
    '4': 0.41
    '5': 0.22
  unite: proportion par code de nomenclature_niveau_tri
  provenance: DOC
  preuve: S-14
  note: 'Nom impose par la relation R-09 du registre des relations injectees. S-12 ne mesurait
    que trois groupes de gravite (urgences vitales environ 10 %, urgences reelles non
    vitales 26 %, consultations non urgentes 64 %), la repartition precedente distribuait
    chaque groupe sur ses niveaux sans mesure de la part interieure a chaque groupe.
    Provenance portee a DOC - le document de cadrage donne desormais la calibration des
    cinq niveaux elle-meme, adossee a S-14 (l''echelle FRENCH deja citee par
    delai_pec_par_niveau pour ses cibles de delai). Si cette repartition etait fausse, la
    pyramide de gravite de la page Urgences serait faussee, sans effet sur le nombre total
    de passages.'
- nom: part_passages_consultation_ordinaire
  valeur: 0.307
  unite: proportion des passages relevant d'une consultation ordinaire (non urgente au sens
    clinique), mesure descriptive sans colonne dediee
  provenance: DOC
  preuve: S-13
  note: 'Parametre ajoute par ce lot : S-13 mesure 30,7 % de consultations non appropriees
    aux urgences sur 410 patients au CHP de Nador (2010). Le registre des champs de
    source.passages_urgences ne porte aucune colonne dediee au caractere ordinaire ou non
    d''un passage (seul niveau_tri existe, et sa repartition en cinq niveaux ne recoupe pas
    directement ce seuil binaire) : ce parametre documente la mesure pour le rapport et la
    justification d''une filiere courte, sans etre applique par le generateur ni verifie sur
    une colonne produite -- inventer une colonne excederait le releve, exactement comme deja
    pratique pour motifs_refus_prise_en_charge (prises_en_charge.yml). Etude anterieure a la
    generalisation de l''AMO et portant sur un etablissement distinct ; retenue comme la
    seule mesure chiffree disponible pour cette grandeur au Maroc. Si cette valeur etait
    fausse, seule la justification qualitative de la recommandation d''une filiere courte
    serait affaiblie, sans effet sur aucune donnee generee.'
- nom: delai_pec_par_niveau
  valeur:
    '1': 1
    '2': 20
    '3': 75
    '4': 120
    '5': 240
  unite: minutes, cible de delai avant prise en charge medicale par niveau de tri
  provenance: DOC
  preuve: S-14
  note: Nom impose par la relation R-10 du registre des relations injectees. S-14 (echelle
    FRENCH) documente six niveaux (1, 2, 3A, 3B, 4, 5) et leurs delais maximaux (1, 20, 60,
    90, 120, 240 minutes) ; la nomenclature deja ecrite de ce generateur n'en retient que
    cinq, le niveau 3 fusionnant 3A et 3B sans que la part de chaque sous-niveau dans la
    fusion soit connue. La valeur retenue pour le niveau 3, 75 minutes, est la moyenne
    simple des deux delais sources (60 et 90), a defaut d'une ponderation mesuree. Si ces
    cibles etaient fausses, l'indicateur de conformite au delai affiche par niveau serait
    faux, sans effet sur le nombre total de passages ni sur leur repartition par niveau.
- nom: taux_respect_cible
  valeur: 0.75
  unite: proportion de passages vus dans le delai cible de leur niveau
  provenance: HYP
  preuve: sans_preuve_externe
  note: Nom impose par la relation R-10 du registre des relations injectees. La consequence
    inscrite au registre est explicite - "le TAUX DE RESPECT est imposé" - ce taux n'est
    donc mesure par aucune source, contrairement aux cibles elles-memes (delai_pec_par_niveau,
    DOC S-14). Pose a 75 %, identique pour tous les niveaux ; la loi de delai est construite
    (voir generator/urgences.py) pour que ce taux mesure sur les donnees reproduise
    exactement ce parametre. Si ce taux etait faux, l'indicateur de conformite affiche au
    tableau de bord serait faux, sans effet sur la mediane des delais par niveau elle-meme.
- nom: orientation_urgences
  valeur:
    RD: 0.76
    HO: 0.102
    TR: 0.12
    SC: 0.015
    DC: 0.003
  unite: proportion par code de nomenclature_orientation_sortie
  provenance: HYP
  preuve: sans_preuve_externe
  note: 'Nom impose par la relation R-11 du registre des relations injectees. Valeurs
    portees aux cinq chiffres du document de cadrage (domicile 76 %, hospitalisation
    10,2 %, transfert 12 %, sortie contre avis 1,5 %, deces 0,3 %) ; le cadrage ne cite
    aucune source propre a ce bloc (contrairement aux trois autres lignes de sa section
    Urgences), provenance restee HYP. Il justifie seulement le taux de transfert ("relevé
    et non résiduel : un établissement sans chirurgie ni réanimation transfère tout ce qui
    en relève"), retenu tel quel comme les quatre autres.

    Consequence mesuree de ce changement, gardee volontairement telle quelle sur decision
    explicite (question posee, reponse recue: appliquer le cadrage tel quel et laisser
    l''Etape 4 de ce lot reveler la tension plutot que de l''arbitrer en amont) : le
    registre des champs ne porte aucune colonne reliant un sejour d''hospitalisation au
    passage aux urgences qui l''a declenche ; generator/mouvements.py lit HO et le ramene
    a une proportion des admissions d''hospitalisation (population plus restreinte que les
    passages aux urgences), pour que le nombre d''admissions de mode urgence egale en
    agrege le nombre de passages aux urgences orientes vers l''hospitalisation -- c''est ce
    mecanisme, deja en place, qui traduit desormais 10,2 % de ~27360 passages sur la
    periode (soit environ 2792) en une part des 2980 admissions de la periode (soit
    environ 93,7 %, mesuree a l''Etape 4) plutot que les 29 % mesures avant ce lot : une
    consequence arithmetique directe de la valeur HO du cadrage combinee au fil des
    episodes gele (admissions_annuelles, S-30), pas un choix de ce lot. Si HO etait faux,
    la part d''admissions de mode urgence serait faussee dans la meme proportion, sans
    effet sur le nombre total de sejours ni sur le nombre de passages aux urgences,
    tous deux geles independamment.'
- nom: modulateur_origine_tri
  valeur:
    '1': 2.0
    '2': 1.5
    '3': 1.0
    '4': 0.6
    '5': 0.3
  unite: multiplicateur de poids par niveau de tri, applique aux arrivees en mode SMUR
  provenance: DOC
  preuve: S-14
  note: 'Nom impose par la relation R-12 du registre des relations injectees ("Un patient
    adresse par un medecin est prioritaire au tri"). Le registre des champs de
    source.passages_urgences ne porte aucune colonne d''origine ou d''adressage distincte
    du mode d''arrivee deja ecrit (nomenclature_mode_arrivee : PC, SMUR, MP, TP) : le mode
    SMUR (ambulance medicalisee, dejà evaluee par une equipe medicale avant l''arrivee) est
    retenu comme le proxy le plus proche de "adresse par un medecin" disponible dans ce
    schema, a defaut d''une colonne dediee - une lecture posee, pas une mesure. Les
    multiplicateurs favorisent les niveaux les plus graves (1, 2) pour les arrivees SMUR et
    defavorisent les niveaux les moins graves (4, 5), dans le sens que R-12 impose. La
    repartition conditionnelle au mode non-SMUR est resolue algebriquement (voir
    generator/urgences.py) pour que la moyenne ponderee par la part d''arrivees SMUR
    reproduise exactement repartition_niveaux_tri, jamais approchee par tirage : le
    modulateur redistribue a l''interieur de la repartition globale, il ne la deplace pas.
    Si ces multiplicateurs etaient faux, la correlation entre mode d''arrivee et niveau de
    tri affichee serait faussee, sans effet sur la repartition globale des niveaux ni sur
    le nombre total de passages.'
- nom: repartition_modes_arrivee
  valeur:
    PC: 0.09
    SMUR: 0.15
    MP: 0.72
    TP: 0.04
  unite: proportion par code de nomenclature_mode_arrivee
  provenance: HYP
  preuve: sans_preuve_externe
  note: Le document de cadrage donne desormais une repartition chiffree entre les quatre
    modes d'arrivee deja documentes (S-12) - moyens propres (MP, 72 %), ambulance (SMUR,
    15 %), protection civile (PC, 9 %), transfert (TP, transport prive, 4 %) - mais la
    classe lui-meme HYP, sans source propre a cette valeur, seule l'existence des quatre
    modes restant sourcee (S-12). Les moyens propres dominent tres largement, plausible pour
    un hopital provincial sans SMUR dedie a grande echelle. Si cette repartition etait
    fausse, la part d'arrivees medicalisees affichee serait faussee, avec un effet indirect
    sur le niveau de tri moyen via le modulateur d'origine, sans effet sur le nombre total
    de passages.
- nom: repartition_motifs_recours
  valeur:
    RESP: 0.15
    DIG: 0.18
    TRAUM: 0.22
    CARDIO: 0.1
    FIEVRE: 0.15
    AUTRE: 0.2
  unite: proportion par code de nomenclature_motif_recours
  provenance: HYP
  preuve: S-13
  note: S-13 documente l'existence de motifs de recours repartis par chapitre CIM-10 sans
    fournir de repartition chiffree transposable directement aux six codes deja ecrits de
    nomenclature_motif_recours. Repartition posee dans un ordre de grandeur plausible
    (traumatismes et motifs digestifs frequents dans un service d'urgences generaliste).
    Si cette repartition etait fausse, la page Urgences afficherait une composition par
    motif invraisemblable, sans effet sur aucun total.
- nom: duree_mediane_minutes_post_prise_en_charge_par_orientation
  valeur:
    RD: 60
    TR: 150
    HO: 90
    SC: 30
    DC: 45
  unite: minutes, mediane d'une loi log-normale, mesuree depuis la prise en charge medicale
    jusqu'a la sortie, par code de nomenclature_orientation_sortie
  provenance: HYP
  preuve: sans_preuve_externe
  note: 'Remplace une premiere version ou la duree totale de presence (arrivee a sortie)
    etait tiree independamment du delai avant prise en charge, sans egard a l''orientation
    de sortie : sur une execution de mesure, cette premiere version faisait sortir 6038
    passages sur 27360 (22 %) exactement une seconde apres leur prise en charge, la duree
    tiree se trouvant alors plus courte que le delai deja ecoule (frequent pour les niveaux
    de tri les moins graves, dont le delai cible est le plus long) ; le mecanisme de secours
    forcait alors la sortie a une seconde apres la prise en charge, un artefact sans rapport
    avec l''orientation reelle. Corrige en tirant desormais, pour chaque passage, une duree
    ecoulee depuis la prise en charge (jamais depuis l''arrivee), dependante de l''orientation
    de sortie : un transfert suppose une regulation, un transport et l''accord d''un service
    receveur (mediane la plus longue, 150 minutes) ; une sortie contre avis est la plus
    rapide par construction (30 minutes) ; une orientation vers l''hospitalisation suppose
    la disponibilite d''un lit et un brancardage (90 minutes) ; un deces suppose des
    demarches de constat (45 minutes) ; un retour a domicile suppose une simple surveillance
    et les formalites de sortie (60 minutes, la valeur la plus basse apres la sortie contre
    avis). Valeurs posees sans source, dans cet ordre de grandeur relatif. Si l''une etait
    fausse, la duree de presence affichee pour l''orientation concernee serait faussee, sans
    effet sur le delai de prise en charge ni sur la repartition des orientations elles-memes.'
- nom: ecart_type_log_duree_urgences
  valeur: 0.4
  unite: ecart-type du logarithme de la duree post-prise en charge, identique a toutes les
    orientations
  provenance: HYP
  preuve: sans_preuve_externe
  note: Meme convention que les autres ecarts-types de loi log-normale de ce generateur
    (ecart_type_log_duree, ecart_type_log_duree_sejour). Pose sans source.
- nom: ecart_type_log_delai_pec
  valeur: 0.6
  unite: ecart-type du logarithme du delai avant prise en charge medicale, identique a
    tous les niveaux
  provenance: HYP
  preuve: sans_preuve_externe
  note: Pose sans source, comme les autres ecarts-types de loi log-normale de ce
    generateur. La moyenne de la loi (parametree via mu, voir generator/urgences.py) est
    resolue pour que la proportion de tirages sous la cible de chaque niveau reproduise
    exactement taux_respect_cible, une contrainte de construction verifiee par le test
    correspondant plutot qu'une valeur posee independamment.
- nom: taux_consentement_transfert
  valeur: 0.95
  unite: proportion des passages transferes
  provenance: HYP
  preuve: sans_preuve_externe
  note: Part des transferts pour lesquels le consentement est recueilli, posee sans
    source, tres majoritaire par construction (un transfert refuse devient une sortie
    contre avis, deja comptee separement dans orientation_urgences). Colonne facultative
    meme pour un transfert. Si ce taux etait faux, la part de transferts consentis
    affichee serait faussee, sans effet sur le nombre total de transferts.
- nom: taux_famille_informee
  valeur: 0.97
  unite: proportion des passages en deces
  provenance: HYP
  preuve: sans_preuve_externe
  note: Part des deces pour lesquels la famille est renseignee comme informee, posee sans
    source, tres majoritaire. Colonne facultative meme pour un deces. Si ce taux etait
    faux, la part affichee serait faussee, sans effet sur le nombre total de deces.
- nom: taux_inventaire_effets
  valeur: 0.97
  unite: proportion des passages en deces
  provenance: HYP
  preuve: sans_preuve_externe
  note: Part des deces pour lesquels l'inventaire des effets personnels est renseigne
    comme etabli, posee sans source, tres majoritaire. Colonne facultative meme pour un
    deces. Si ce taux etait faux, la part affichee serait faussee, sans effet sur le
    nombre total de deces.
