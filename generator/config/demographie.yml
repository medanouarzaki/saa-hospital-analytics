      45-64: 1.1
      65+: 0.9
  unite: multiplicateurs par categorie de premier episode et par tranche d'age
  provenance: HYP
  preuve: S-05
  note: 'Nom impose par la relation R-13 du registre des relations injectees. Multiplicateurs appliques
    a structure_age selon la categorie du premier episode du patient (H, C ou U), puis renormalises. R-13
    (S-05) dit que le recours surrepresente les moins de 5 ans, les femmes de 18 a 45 ans et les plus
    de 60 ans, sans chiffrer l''ampleur : l''ampleur retenue ici (facteurs 1,5 a 1,6 pour les tranches
    extremes en H et U, 1,1 a 1,3 pour les tranches medianes en C) est posee, pas mesuree. La variation
    par sexe decrite par R-13 n''est pas reprise separement, simplification explicite : seule la variation
    par age et par categorie est modelisee. Si ces facteurs etaient faux, l''ecart de structure d''age
    entre categories serait plus ou moins marque, potentiellement jusqu''a disparaitre, sans effet sur
    le nombre de fiches produites par categorie.'
