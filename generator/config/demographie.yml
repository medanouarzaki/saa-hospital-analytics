- nom: taux_exitus_par_tranche
  valeur:
    0-4: 0.006
    5-14: 0.01
    15-24: 0.016
    25-44: 0.024
    45-64: 0.04
    65+: 0.08
  unite: proportion par tranche d'age
  provenance: HYP
  preuve: sans_preuve_externe
  note: Remplace le taux_exitus scalaire unique (0,02 pour toute la population),
    qui ne satisfaisait que la moitie de l'exigence de vraisemblance (part tres minoritaire, mais aucune
    croissance avec l'age). Chaque taux croit strictement avec la tranche, reste minoritaire (maximum
    8 %), et sa moyenne ponderee par structure_age (~0,024) reste proche de l'ancien taux scalaire, pour
    une part globale de deces affichee comparable. Poses sans source faute de statistique de mortalite
    hospitaliere disponible pour l'etablissement. Si ces taux etaient faux, la courbe de mortalite par
    age serait plus ou moins marquee, potentiellement jusqu'a s'aplatir, sans effet sur le nombre de fiches
    produites.
- nom: taux_modification_fiche
  valeur: 0.15
  unite: proportion
  provenance: HYP
  preuve: sans_preuve_externe
  note: 'Part des fiches patient modifiees au moins une fois apres leur creation, posee sans source. Ce
    parametre n''est pas decoratif : sans lui, aucune fiche ne reparait dans une partition ulterieure,
    et la couche d''historisation des blocs suivants n''aurait rien a historiser. Si ce taux etait faux,
    le volume de fiches reapparaissant serait faussee dans le meme sens, sans effet sur le nombre de fiches
    distinctes produites.'
- nom: loi_delai_modification
  valeur:
    forme: exponentielle
    echelle_jours: 90
  unite: loi de decroissance et echelle
  provenance: HYP
  preuve: sans_preuve_externe
  note: Delai entre la creation d'une fiche et sa modification, tire d'une loi exponentielle d'echelle
    90 jours, posee sans source. Si cette echelle etait fausse, la repartition des modifications dans
    le temps serait plus ou moins concentree pres de la creation, sans effet sur le nombre de fiches modifiees,
    fixe par taux_modification_fiche.
- nom: repartition_type_modification
  valeur:
    demenagement: 0.4
    telephone: 0.3
    etat_civil: 0.15
    couverture: 0.15
  unite: proportion par type de changement metier, parmi les fiches modifiees
  provenance: HYP
  preuve: sans_preuve_externe
  note: 'Type de changement metier porte par une fiche reextraite, tire independamment du delai de
    loi_delai_modification, posee sans source. Le demenagement (adresse) est pose majoritaire car
    c''est le motif de reextraction le plus frequent dans un dossier administratif hospitalier ; les
    trois autres types se partagent le reste. Somme verifiee a 1 par un test, pas par relecture. Si
    cette repartition etait fausse, la part de chaque type de changement metier serait faussee, sans
    effet sur le nombre total de fiches modifiees, fixe par taux_modification_fiche.'
