parametres:
- nom: structure_age
  valeur:
    tranches:
    - 0-4
    - 5-14
    - 15-24
    - 25-44
    - 45-64
    - 65+
    parts:
    - 0.08
    - 0.17
    - 0.16
    - 0.3
    - 0.2
    - 0.09
  unite: tranches et parts
  provenance: HYP
  preuve: S-05
  note: 'S-05 mentionne l''existence d''une pyramide des âges de la préfecture de Meknès, mais son contenu
    chiffré n''est pas extrait dans le dépôt (document source absent de ~/extraction-sc/) : seule l''existence
    de la source est établie, pas ses valeurs. Les six tranches et leurs parts sont posées par convention,
    plausibles pour une population marocaine jeune. Si cette structure était fausse, la pyramide des âges
    affichée au tableau de bord serait invraisemblable, sans effet sur le nombre de fiches produites.'
- nom: repartition_sexe
  valeur:
    M: 0.497
    F: 0.503
  unite: proportion
  provenance: HYP
  preuve: sans_preuve_externe
  note: Répartition posée à parité quasi stricte, conforme à l'ordre de grandeur national usuel, sans
    source enregistrée spécifique à l'établissement. Si cette répartition était fausse, la parité affichée
    serait légèrement faussée, sans effet sur le nombre de fiches produites.
- nom: repartition_couverture
  valeur:
    '00116': 0.5
    '00042': 0.15
    00089: 0.15
    SANS: 0.2
  unite: proportion par code de nomenclature_compagnie_assurance
  provenance: HYP
  preuve: S-15
  note: 'Nom imposé par la relation R-08 du registre des relations injectées. S-15 mesure les parts nationales
    des régimes AMO (Tadamon, TNS, Achamil, autres), mais R-08 dit lui-même explicitement que « les effectifs
    nationaux sont sourcés, la clé de recours hospitalier ne l''est pas » : la correspondance entre régimes
    nationaux et compagnies de nomenclature_compagnie_assurance n''est pas établie, la répartition retenue
    ici est posée, informée sans être dérivée. 00116 (CNSS PIPC) est majoritaire, seule compagnie concrètement
    observée au relevé de champs (REL-PAT.A01). Si cette répartition était fausse, la composition par
    régime affichée au tableau de bord serait imposée à tort, sans effet sur le nombre de fiches produites.'
- nom: profil_recours_demographique
  valeur:
    H:
      0-4: 1.6
      5-14: 0.8
      15-24: 0.8
      25-44: 0.9
      45-64: 1.1
      65+: 1.6
    U:
      0-4: 1.5
      5-14: 0.9
      15-24: 0.9
      25-44: 0.9
      45-64: 1.0
      65+: 1.5
    C:
      0-4: 0.7
      5-14: 0.9
      15-24: 1.1
      25-44: 1.3
      45-64: 1.1
      65+: 0.9
  unite: multiplicateurs par catégorie de premier épisode et par tranche d'âge
  provenance: HYP
  preuve: S-05
  note: 'Nom imposé par la relation R-13 du registre des relations injectées. Multiplicateurs appliqués
    à structure_age selon la catégorie du premier épisode du patient (H, C ou U), puis renormalisés. R-13
    (S-05) dit que le recours surreprésente les moins de 5 ans, les femmes de 18 à 45 ans et les plus
    de 60 ans, sans chiffrer l''ampleur : l''ampleur retenue ici (facteurs 1,5 à 1,6 pour les tranches
    extrêmes en H et U, 1,1 à 1,3 pour les tranches médianes en C) est posée, pas mesurée. La variation
    par sexe décrite par R-13 n''est pas reprise séparément, simplification explicite : seule la variation
    par âge et par catégorie est modélisée. Si ces facteurs étaient faux, l''écart de structure d''âge
    entre catégories serait plus ou moins marqué, potentiellement jusqu''à disparaître, sans effet sur
    le nombre de fiches produites par catégorie.'
