parametres:
- nom: structure_age
  valeur:
    tranches:
    - 0-4
    - 5-14
    - 15-24
    - 25-44
    - 45-64
    - 65+
    parts:
    - 0.08
    - 0.17
    - 0.16
    - 0.3
    - 0.2
    - 0.09
  unite: tranches et parts
  provenance: HYP
  preuve: S-05
  note: 'S-05 mentionne l''existence d''une pyramide des ages de la prefecture de Meknes, mais son contenu
    chiffre n''est pas extrait dans le depot (document source absent de ~/extraction-sc/) : seule l''existence
    de la source est etablie, pas ses valeurs. Les six tranches et leurs parts sont posees par convention,
    plausibles pour une population marocaine jeune. Si cette structure etait fausse, la pyramide des ages
    affichee au tableau de bord serait invraisemblable, sans effet sur le nombre de fiches produites.'
- nom: repartition_sexe
  valeur:
    M: 0.497
    F: 0.503
  unite: proportion
  provenance: HYP
  preuve: sans_preuve_externe
  note: Repartition posee a parite quasi stricte, conforme a l'ordre de grandeur national usuel, sans
    source enregistree specifique a l'etablissement. Si cette repartition etait fausse, la parite affichee
    serait legerement faussee, sans effet sur le nombre de fiches produites.
- nom: repartition_couverture
  valeur:
    '00116': 0.5
    '00042': 0.15
    00089: 0.15
    SANS: 0.2
  unite: proportion par code de nomenclature_compagnie_assurance
  provenance: HYP
  preuve: S-15
  note: 'Nom impose par la relation R-08 du registre des relations injectees. S-15 mesure les parts nationales
    des regimes AMO (Tadamon, TNS, Achamil, autres), mais R-08 dit lui-meme explicitement que les effectifs
    nationaux sont sources, la cle de recours hospitalier ne l''est pas : la correspondance entre regimes
    nationaux et compagnies de nomenclature_compagnie_assurance n''est pas etablie, la repartition retenue
    ici est posee, informee sans etre derivee. 00116 (CNSS PIPC) est majoritaire, seule compagnie concretement
    observee au releve de champs (REL-PAT.A01). Si cette repartition etait fausse, la composition par
    regime affichee au tableau de bord serait imposee a tort, sans effet sur le nombre de fiches produites.'
