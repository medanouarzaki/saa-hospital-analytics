- nom: repartition_residence
  valeur:
    region:
      FM: 0.95
      TT: 0.02
      CS: 0.02
      RS: 0.01
    province:
      MEK: 0.7
      FES: 0.1
      ELH: 0.08
      IFR: 0.07
      KHE: 0.03
      SEF: 0.02
    ville:
      MEK: 0.7
      FES: 0.1
      ELH: 0.08
      IFR: 0.07
      KHE: 0.05
    environnement:
      U: 0.639
      R: 0.361
  unite: proportion par code de nomenclature, par colonne géographique
  provenance: HYP
  preuve: S-05
  note: 'Répartition géographique de résidence, cohérente avec l''implantation de l''établissement à Meknès
    : la préfecture de Meknès domine (70 %) province et ville, la région Fès-Meknès domine (95 %) la région.
    Le partage urbain/rural (63,9 % / 36,1 %) reprend la mesure régionale de S-05 (2 855 366 urbains,
    1 612 545 ruraux sur 4 467 911), seule part de cette entrée directement mesurée ; les poids par ville,
    province et région sont posés sans source. Si cette répartition était fausse, la carte de provenance
    des patients serait faussée, sans effet sur le nombre de fiches produites.'
- nom: repartition_pays
  valeur:
    '504': 0.95
    '250': 0.01
    '012': 0.01
    '788': 0.01
    '724': 0.01
    '478': 0.01
  unite: proportion par code de nomenclature_pays
  provenance: HYP
  preuve: REL-PAT.H07
  note: >-
    Répartition retenue pour nationalite et pays_naissance, partagée entre les deux
    colonnes. Le code 504 (MAROC) est dominant à 95 %, conforme à ce que le relevé de
    champs observe comme la nationalité et le pays de naissance de la très grande
    majorité des patients d'un hôpital provincial (REL-PAT.H07, REL-PAT.N05). Les cinq
    autres codes se partagent le reste à parts égales, posé sans source distincte. Si
    cette répartition était fausse, la part de patients étrangers affichée serait
    faussée, sans effet sur aucun total.
- nom: gabarit_identifiant_patient
  valeur: IPP-{rang:06d}
  unite: gabarit de formatage
  provenance: HYP
  preuve: sans_preuve_externe
  note: 'Gabarit interprété par le générateur à partir du rang d''apparition rendu par le fil des épisodes,
    jamais écrit en dur ailleurs. Choix technique, non observé : le relevé de champs ne montre aucune
    valeur de n_ipp. Si ce gabarit était faux, seule la forme visuelle de l''identifiant en serait affectée,
    sans effet sur son rang ni sur sa croissance.'
- nom: taux_avertissements_sms
  valeur: 0.6
  unite: proportion
  provenance: HYP
  preuve: sans_preuve_externe
  note: Part des patients ayant activé les avertissements SMS, posée sans source. Si ce taux était faux,
    seule la proportion affichée serait affectée, sans effet sur aucun total.
- nom: taux_avertissements_email
  valeur: 0.3
  unite: proportion
  provenance: HYP
  preuve: sans_preuve_externe
  note: Part des patients ayant activé les avertissements courriel, posée sans source. Si ce taux était
    faux, seule la proportion affichée serait affectée, sans effet sur aucun total.
- nom: taux_exitus
  valeur: 0.02
  unite: proportion
  provenance: HYP
  preuve: sans_preuve_externe
  note: Part des fiches patient marquées décédées, posée sans source faute de statistique de mortalité
    hospitalière disponible pour l'établissement. Si ce taux était faux, seule la proportion affichée
    serait affectée, sans effet sur aucun total.
- nom: taux_modification_fiche
  valeur: 0.15
  unite: proportion
  provenance: HYP
  preuve: sans_preuve_externe
  note: 'Part des fiches patient modifiées au moins une fois après leur création, posée sans source. Ce
    paramètre n''est pas décoratif : sans lui, aucune fiche ne reparaît dans une partition ultérieure,
    et la couche d''historisation des blocs suivants n''aurait rien à historiser. Si ce taux était faux,
    le volume de fiches réapparaissant serait faussé dans le même sens, sans effet sur le nombre de fiches
    distinctes produites.'
- nom: loi_delai_modification
  valeur:
    forme: exponentielle
    echelle_jours: 90
  unite: loi de décroissance et échelle
  provenance: HYP
  preuve: sans_preuve_externe
  note: Délai entre la création d'une fiche et sa modification, tiré d'une loi exponentielle d'échelle
    90 jours, posée sans source. Si cette échelle était fausse, la répartition des modifications dans
    le temps serait plus ou moins concentrée près de la création, sans effet sur le nombre de fiches modifiées,
    fixé par taux_modification_fiche.
