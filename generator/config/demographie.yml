    (colonne a valeur unique, mesuré), et modifie_par n''avait que deux valeurs (vide ou SYSTEME).
    Desormais, cree_par et modifie_par sont tires dans ce petit ensemble de comptes plausibles (agents
    d''accueil, infirmiers de bureau des entrees), poses sans source. Si cette liste etait fausse, les
    comptes affiches seraient invraisemblables, sans effet sur aucun total.'
