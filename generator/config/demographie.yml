- nom: repartition_residence
  valeur:
    region:
      FM: 0.95
      TT: 0.02
      CS: 0.02
      RS: 0.01
    par_region:
      FM:
        MEK: 0.7
        FES: 0.1
        ELH: 0.08
        IFR: 0.07
        KHE: 0.05
      TT:
        TNG: 1.0
      CS:
        CAS: 1.0
      RS:
        RAB: 1.0
    environnement:
      U: 0.639
      R: 0.361
  unite: proportion par code de nomenclature, par colonne geographique
  provenance: HYP
  preuve: S-05
  note: 'la region est tiree en premier, puis ville
    et province partagent le meme tirage par_region[region], donc portent toujours le meme code par construction.
    Avant cette restructuration, ville, province et region etaient tirees independamment, ce qui produisait
    48,93 % de lignes ou ville differait de province et 5,15 % de lignes ou une province de Fes-Meknes
    etait associee a une region differente (mesuré). MEK domine (70 %) la region
    Fes-Meknes, coherent avec l''implantation de l''etablissement a Meknes ; TT, CS et RS ne portent chacune
    qu''un seul chef-lieu (TNG, CAS, RAB), une simplification explicite qui ne distingue pas les provinces
    a l''interieur de ces regions minoritaires. Le partage urbain/rural (63,9 % / 36,1 %) reprend la mesure
    regionale de S-05 (2 855 366 urbains, 1 612 545 ruraux sur 4 467 911), seule part de cette entree
    directement mesuree ; les poids par ville et par region sont poses sans source. Si cette repartition
    etait fausse, la carte de provenance des patients serait faussee, sans effet sur le nombre de fiches
    produites.'
- nom: repartition_pays
  valeur:
    '504': 0.95
    '250': 0.01
    '012': 0.01
    '788': 0.01
    '724': 0.01
    '478': 0.01
  unite: proportion par code de nomenclature_pays
  provenance: HYP
  preuve: REL-PAT.H07
  note: 'Repartition retenue pour nationalite et pays_naissance, partagee entre les deux colonnes, tirees
    independamment l''une de l''autre (accord non exige : la nationalite et le pays de naissance sont
    deux attributs distincts qui peuvent legitimement differer, mesuré : 9,45 % de
    lignes ou ils different, un taux compatible avec un tirage independant a 95 % / 95 %, sans signal
    d''incoherence). Le code 504 (MAROC) est dominant a 95 %, conforme a ce que le releve de champs observe
    comme la nationalite et le pays de naissance de la tres grande majorite des patients d''un hopital
    provincial (REL-PAT.H07, REL-PAT.N05). Les cinq autres codes se partagent le reste a parts egales,
    pose sans source distincte. Si cette repartition etait fausse, la part de patients etrangers affichee
    serait faussee, sans effet sur aucun total.'
