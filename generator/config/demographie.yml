    aucun total.'
- nom: taux_renseignement
  valeur:
    telephone_2: 0.15
    telephone_3: 0.04
    telephone_4: 0.01
    commentaire: 0.12
    email: 0.85
    nom_famille_2: 0.9
    profession: 0.6
  unite: proportion de fiches ou la colonne est renseignee
  provenance: HYP
  preuve: sans_preuve_externe
  note: 'ces sept colonnes sont facultatives, une fiche reelle ne les renseigne
    pas toutes. Avant, telephone_2/3/4 et commentaire etaient vides sur 100 % des lignes et profession
    valait la constante NON PRECISEE sur 100 % des lignes (colonnes a valeur unique, relevees au 1.2) ;
    email et nom_famille_2 etaient renseignees sur 100 % des lignes. Une valeur absente ici parce que la
    colonne est facultative et n''a pas ete saisie est une absence structurelle, qui fait partie du jeu
    de donnees normal : ce n''est pas un defaut injecte. Le decompte de la verite terrain, plus
    ulterieur, ne doit compter que les defauts reellement injectes, pas ces absences structurelles. Si
    ces taux etaient faux, la part de fiches renseignees pour ces colonnes serait faussee, sans effet
    sur aucun total. Profession reajuste ensuite de 0,4 a 0,6 : le taux de champs
    manquants du cadrage pour cette colonne (44 % de manquant au total) est inferieur a ce que
    l''ancienne valeur (0,4 renseigne, 60 % manquant) produisait a elle seule -- un mecanisme
    d''injection ne peut qu''ajouter de l''absence, jamais en retirer. Le tirage de la profession
    consomme un nombre de tirages aleatoires variable (un tirage supplementaire pour chaque fiche
    renseignee), si bien que deplacer ce seuil decale la position du flux aleatoire pour toutes
    les fiches suivantes et, par ricochet, les tables qui lisent source.patients en entree
    (mesure avant d''ecrire : un premier essai a 0,7 renseigne faisait sortir la conformite des
    journees d''hospitalisation de sa tolerance de 3 % etablie anterieurement, 3,34 % contre
    1,65 % avant ajustement). Remonter la part structurelle a 60 % renseigne (40 % manquant, la
    plus petite hausse qui reste sous la cible de 44 %) laisse un espace etroit mais suffisant a
    l''injection, tout en minimisant ce decalage -- revarifie a cette valeur, la conformite reste
    verte.'
