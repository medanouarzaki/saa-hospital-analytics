    - name: province
      description: Relevé de champs, recherche d'IPP, colonne de résultat. La colonne
        n'apparaît pas au bloc Domicile de la fiche patient, où figurent État, Ville
        et Quartier ; elle est établie par la liste de résultats de la recherche,
        qui la restitue.
      meta:
        provenance: OBS
        preuve: REL-IPP.R09
        type_metier: code
    - name: exitus
      description: Relevé de champs, recherche d'IPP, filtre de population. L'existence
        d'un filtre sur les patients décédés établit qu'un indicateur de décès est
        stocké sur la fiche, bien qu'aucun champ de ce nom n'ait été relevé sur l'écran
        de la fiche patient.
      meta:
        provenance: OBS
        preuve: REL-IPP.F04
        type_metier: booleen
    - name: date_modification
      description: L'écran de la fiche patient porte un champ Modifié par sans horodatage
        adjacent, là où l'écran de rendez-vous appareille chaque agent à sa date.
        La colonne est posée parce que l'historisation de la dimension patient en
        type 2 exige un instant de changement. Si l'extraction réelle ne la fournissait
        pas, l'historisation se rabattrait sur la date d'extraction de la partition,
        à la granularité du jour au lieu de la seconde, et les changements survenus
        le même jour seraient confondus.
      meta:
        provenance: HYP
        preuve: sans_preuve_externe
        type_metier: horodatage
    - name: date_extraction
      description: Colonne technique de la zone d'atterrissage, absente du système
        observé. Elle porte la date de l'extraction dont la ligne provient et rend
        le rechargement d'une partition idempotent. Si une extraction réelle ne la
        fournissait pas, elle serait dérivée du nom du fichier partitionné, sans perte
        d'information.
      meta:
        provenance: HYP
        preuve: sans_preuve_externe
        type_metier: date
  - name: rendez_vous
    columns:
    - name: n_rdv
      description: Aucun identifiant de rendez-vous n'apparaît à l'écran Donner rendez-vous,
        dont la barre d'actions comporte pourtant Enregistrer, Supprimer et Chercher,
        trois opérations qui supposent une clé. La colonne est posée parce que la
        table des passages porte une référence de rendez-vous nullable, qui n'aurait
        pas de cible sans elle. Si le système en place clé le rendez-vous par un couple
        agenda et horodatage plutôt que par un numéro, la structure logique du modèle
        est inchangée et seule la forme de la clé diffère.
      meta:
        provenance: HYP
        preuve: sans_preuve_externe
        type_metier: code
