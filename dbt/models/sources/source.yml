        type_metier: decimal
    - name: montant
      description: Le montant de la ligne se calcule sur la grille des lettres clés
        de la tarification nationale de référence.
      meta:
        provenance: DOC
        preuve: S-17
        type_metier: decimal
    - name: service_executant
      description: Le module Facturación rattache chaque activité facturable au service
