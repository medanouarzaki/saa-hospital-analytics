  - name: passages
    columns:
    - name: n_passage
      description: Le module Consultas de l'éditeur documente la gestion des consultations
        et la production de leurs listings, ce qui suppose un identifiant de passage.
      meta:
        provenance: DOC
        preuve: S-08
        type_metier: code
    - name: n_ipp
      description: Relevé de champs, fiche patient, bloc Données principales.
      meta:
        provenance: OBS
        preuve: REL-PAT.D01
        type_metier: code
    - name: type_passage
      description: 'La liste de travail du module Médicos regroupe les patients par
        type d''épisode : hospitalisés, consultation, urgences. Le système type donc
        ses épisodes.'
      meta:
        provenance: DOC
        preuve: S-06
        type_metier: code
    - name: service
      description: 'Article 27 du règlement intérieur : l''hôpital s''organise en
        services, et l''activité s''y rattache.'
      meta:
        provenance: DOC
        preuve: S-27
        type_metier: code
    - name: activite
      description: Relevé de champs, écran Donner rendez-vous, bloc Rendez-vous. Le
        même référentiel d'activités qualifie le rendez-vous et le passage qui l'honore.
      meta:
        provenance: OBS
        preuve: REL-RDV.R02
        type_metier: code
    - name: n_rdv
      description: 'La colonne rattache le passage au rendez-vous qui l''a programmé,
        et hérite du caractère hypothétique de l''identifiant de rendez-vous lui-même,
        qui n''apparaît sur aucun écran. Elle est nullable : un passage peut survenir
        sans rendez-vous préalable. Si le système en place ne conservait pas ce rattachement,
        le délai d''obtention resterait mesurable sur la table des rendez-vous, mais
        le taux d''honoration des rendez-vous ne le serait plus.'
      meta:
        provenance: HYP
        preuve: sans_preuve_externe
        type_metier: code
    - name: mode_prise_en_charge
      description: Le tiers payant distingue les modes de prise en charge selon le
        régime et le caractère ambulatoire ou hospitalier de la prestation.
      meta:
        provenance: DOC
        preuve: S-18
        type_metier: code
    - name: date_heure_entree
      description: Le module Consultas gère la programmation et le déroulement de
        la consultation, dont l'heure d'entrée.
      meta:
        provenance: DOC
        preuve: S-08
        type_metier: horodatage
    - name: date_heure_sortie
      description: Idem, borne de fin du passage.
      meta:
        provenance: DOC
        preuve: S-08
        type_metier: horodatage
    - name: medecin
      description: Le module Médicos rattache l'épisode au praticien qui le prend
        en charge.
      meta:
        provenance: DOC
        preuve: S-06
        type_metier: texte
    - name: cree_par
