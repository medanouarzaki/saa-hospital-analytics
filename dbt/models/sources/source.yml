        provenance: HYP
        preuve: sans_preuve_externe
        type_metier: date
  - name: encaissements
    columns:
    - name: n_encaissement
      description: L'article 79 du règlement intérieur range le règlement des frais
        parmi les formalités de sortie, ce qui identifie chaque encaissement.
      meta:
        provenance: DOC
        preuve: S-27
