        provenance: DOC
        preuve: S-27
        type_metier: code
    - name: consentement_transfert
      description: L'article 47 du règlement intérieur exige le consentement écrit
        du patient pour un transfert, sauf extrême urgence.
      meta:
        provenance: DOC
        preuve: S-27
        type_metier: booleen
    - name: famille_informee
      description: Les articles 47 et 67 du règlement intérieur imposent d'informer
        la famille, lors d'un transfert comme pour un patient mineur, incapable ou
        inconscient.
      meta:
        provenance: DOC
        preuve: S-27
        type_metier: booleen
    - name: inventaire_effets
      description: L'article 45 du règlement intérieur impose un inventaire contradictoire
