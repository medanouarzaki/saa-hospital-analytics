        provenance: DOC
        preuve: S-27
        type_metier: horodatage
    - name: mode_reglement
      description: Aucune source ouverte ne documente les moyens de paiement acceptés
        au guichet d'un hôpital public marocain ; la Cour des comptes décrit seulement
        un versement direct chez le régisseur. La colonne est posée parce que la page
        de recouvrement du tableau de bord distingue les canaux d'encaissement. Si
        la répartition retenue était fausse, aucun taux de recouvrement ni aucune
        ancienneté de créance n'en serait affecté, ces grandeurs ne dépendant que
        du montant et de la date.
      meta:
        provenance: HYP
        preuve: sans_preuve_externe
        type_metier: code
    - name: montant
      description: Le montant encaissé suit les taux de prise en charge de la tarification
        nationale de référence.
      meta:
        provenance: DOC
        preuve: S-18
        type_metier: decimal
    - name: regisseur
      description: Le rapport de la Cour des comptes décrit un paiement direct chez
        le régisseur.
      meta:
        provenance: DOC
        preuve: S-20
        type_metier: texte
    - name: billet_sortie_delivre
      description: L'article 79 du règlement intérieur conditionne la délivrance du
        billet de sortie au règlement des frais ou à la signature des documents de
        prise en charge.
      meta:
        provenance: DOC
        preuve: S-27
        type_metier: booleen
    - name: date_extraction
      description: Colonne technique de la zone d'atterrissage, absente du système
