  - name: mouvements
    columns:
    - name: n_sejour
      description: 'Article 40 : les formalités d''admission ouvrent un dossier de
        séjour identifié.'
      meta:
        provenance: DOC
        preuve: S-27
        type_metier: code
    - name: n_ipp
      description: Relevé de champs, fiche patient, bloc Données principales.
      meta:
        provenance: OBS
        preuve: REL-PAT.D01
        type_metier: code
    - name: date_heure_admission
      description: Article 40, formalités d'admission ordinaire.
      meta:
        provenance: DOC
        preuve: S-27
        type_metier: horodatage
    - name: mode_admission
      description: 'Articles 40, 42 et 45 : l''admission est ordinaire ou en urgence,
        et les formalités diffèrent.'
      meta:
        provenance: DOC
        preuve: S-27
        type_metier: code
    - name: service_accueil
      description: 'Article 44 : l''hospitalisation est ordonnée vers un service.'
      meta:
        provenance: DOC
        preuve: S-27
        type_metier: code
    - name: lit
      description: Aucune source ne documente l'identification du lit occupé, alors
        que la capacité litière fonctionnelle est publiée par établissement et que
        l'article 42 impose l'admission même en cas d'indisponibilité de lits, ce
        qui suppose un suivi de l'occupation. La colonne est posée parce que le taux
        d'occupation du tableau de bord se recalcule depuis les journées d'hospitalisation,
        non depuis les lits ; si elle était fausse ou absente, aucun indicateur du
        chapitre sur l'activité ne changerait.
      meta:
        provenance: HYP
        preuve: sans_preuve_externe
        type_metier: texte
    - name: n_mutation
      description: 'Article 35 : le service gère les effectifs des patients et leurs
        mouvements à l''intérieur de l''hôpital.'
      meta:
        provenance: DOC
        preuve: S-27
        type_metier: code
    - name: service_origine
      description: Article 35, mouvements internes.
      meta:
        provenance: DOC
        preuve: S-27
        type_metier: code
    - name: service_destination
