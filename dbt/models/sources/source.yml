        d'information.
      meta:
        provenance: HYP
        preuve: sans_preuve_externe
        type_metier: date
  - name: creances
    columns:
    - name: n_creance
      description: L'article 9, paragraphe b, du règlement intérieur charge le pôle
        des affaires administratives du recouvrement des créances de l'établissement,
        ce qui identifie chaque créance.
      meta:
        provenance: DOC
        preuve: S-27
        type_metier: code
    - name: n_facture
      description: L'article 9, paragraphe b, du règlement intérieur rattache la créance
        recouvrée à la facture qui l'a fait naître.
      meta:
        provenance: DOC
        preuve: S-27
        type_metier: code
    - name: date_naissance_creance
      description: L'article 79 du règlement intérieur fait naître la créance aux
        formalités de sortie, lorsque la facturation n'est pas soldée.
      meta:
        provenance: DOC
        preuve: S-27
        type_metier: date
    - name: montant_du
      description: Le rapport de la Cour des comptes établit l'existence d'un état
        des prestations non recouvrées, dont le montant dû.
      meta:
        provenance: DOC
        preuve: S-20
        type_metier: decimal
    - name: montant_recouvre
      description: Le rapport de la Cour des comptes établit l'existence d'un état
        des prestations non recouvrées, dont le montant recouvré.
      meta:
        provenance: DOC
        preuve: S-20
        type_metier: decimal
    - name: montant_restant
      description: 'Le rapport de la Cour des comptes établit l''existence d''un état
        des prestations non recouvrées, dont le montant restant dû. Cette colonne
        est conservée bien qu''elle se déduise des deux colonnes voisines : sa redondance
        interne à la ligne ne dépend pas de la date de lecture, et l''écart éventuel
        entre les trois montants est un contrôle de cohérence exploitable.'
      meta:
        provenance: DOC
        preuve: S-20
        type_metier: decimal
    - name: type_debiteur
      description: Le module Facturación distingue les débiteurs publics, privés,
        mutualistes et particuliers.
      meta:
        provenance: DOC
        preuve: S-09
        type_metier: code
    - name: motif_non_recouvrement
      description: Le rapport de la Cour des comptes relève des sorties sans règlement,
        des patients non identifiés et des évasions comme motifs de non-recouvrement.
      meta:
        provenance: DOC
        preuve: S-20
        type_metier: code
    - name: date_extraction
      description: Colonne technique de la zone d'atterrissage, absente du système
        observé. Elle porte la date de l'extraction dont la ligne provient et rend
        le rechargement d'une partition idempotent. Si une extraction réelle ne la
        fournissait pas, elle serait dérivée du nom du fichier partitionné, sans perte
        d'information.
      meta:
        provenance: HYP
        preuve: sans_preuve_externe
        type_metier: date
  - name: relances
    columns:
    - name: n_relance
      description: Aucune source ouverte ne documente une procédure de relance formalisée
        dans cet établissement ; le rapport de la Cour des comptes constate au contraire
        l'absence de diligences de recouvrement. La colonne identifie chaque relance
        parce que la page de recouvrement du tableau de bord la mobilise ; ce que
        la chaîne démontre ici est la calculabilité de l'indicateur, non une mesure.
      meta:
        provenance: HYP
        preuve: sans_preuve_externe
        type_metier: code
    - name: n_creance
      description: Aucune source ouverte ne documente une procédure de relance formalisée
        ; la seule source disponible sur le recouvrement décrit au contraire son absence.
        La colonne rattache la relance à la créance parce que le tableau de bord en
        a besoin pour sa page recouvrement ; elle démontre une calculabilité, non
        une pratique observée.
      meta:
        provenance: HYP
        preuve: sans_preuve_externe
        type_metier: code
    - name: date_relance
      description: Aucune source ouverte ne documente de procédure de relance formalisée
        dans cet établissement, et le rapport de la Cour des comptes constate précisément
        l'absence de diligences de recouvrement. La date de relance est posée parce
        que la page de recouvrement du tableau de bord en a besoin ; elle atteste
        une calculabilité, non un fait mesuré.
      meta:
        provenance: HYP
        preuve: sans_preuve_externe
        type_metier: date
    - name: canal
      description: Aucune source ouverte ne documente les canaux de relance employés
        dans cet établissement ; la source disponible sur le recouvrement décrit au
        contraire une carence de diligences. La colonne existe parce que le tableau
        de bord distingue les canaux à sa page recouvrement ; elle démontre une capacité
        de calcul, pas une observation.
      meta:
        provenance: HYP
        preuve: sans_preuve_externe
        type_metier: code
    - name: resultat
      description: Aucune source ouverte ne documente le résultat d'une procédure
        de relance dans cet établissement, dont la seule source disponible sur le
        recouvrement décrit l'absence de diligences. La colonne est posée parce que
        la page de recouvrement du tableau de bord en a besoin ; ce qu'elle démontre
        est une calculabilité, non une mesure.
      meta:
        provenance: HYP
        preuve: sans_preuve_externe
        type_metier: code
    - name: date_extraction
      description: Colonne technique de la zone d'atterrissage, absente du système
        observé. Elle porte la date de l'extraction dont la ligne provient et rend
        le rechargement d'une partition idempotent. Si une extraction réelle ne la
        fournissait pas, elle serait dérivée du nom du fichier partitionné, sans perte
        d'information.
      meta:
        provenance: HYP
        preuve: sans_preuve_externe
        type_metier: date
