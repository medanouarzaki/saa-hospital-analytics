        imposée par l'article 35 du règlement intérieur.
      meta:
        provenance: DOC
        preuve: S-17
        type_metier: texte
    - name: lettre_cle
      description: La tarification nationale de référence rémunère l'acte par une
        lettre clé et un coefficient.
      meta:
        provenance: DOC
        preuve: S-17
        type_metier: code
    - name: coefficient
      description: La tarification nationale de référence rémunère l'acte par une
        lettre clé et un coefficient.
      meta:
        provenance: DOC
        preuve: S-17
        type_metier: decimal
    - name: quantite
      description: La structure d'une ligne de facturation hospitalière comporte usuellement
        une quantité distincte du coefficient de la lettre clé, mais aucune des sources
        ouvertes ne la documente pour le secteur public marocain. La colonne est posée
        parce que sans elle un acte répété le même jour se confondrait avec un acte
        unique. Si elle était absente du système réel, les montants resteraient exacts
        et seul le dénombrement des actes par ligne serait affecté.
