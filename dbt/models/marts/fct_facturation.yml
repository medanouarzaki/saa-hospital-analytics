version: 2

models:
  - name: fct_facturation
    tests:
      - meme_decompte_que_la_source:
          arguments:
            compare_model: "{{ source('source', 'factures') }}"
      - version_patient_comptable:
          arguments:
            jour_column: "date_facture"
    columns:
      - name: n_facture
        tests:
          - unique
          - not_null
      - name: n_ipp
        tests:
          - not_null
      - name: n_episode
        tests:
          - not_null
          - relationships:
              arguments:
                to: "{{ ref('fct_passage') }}"
                field: "n_passage"
      - name: type_episode
        tests:
          - not_null
      - name: date_facture
        tests:
          - not_null
          - relationships:
              arguments:
                to: "{{ ref('dim_date') }}"
                field: "date_jour"
      - name: type_facture
        tests:
          - not_null
      - name: service_emetteur
        tests:
          - not_null
          - relationships:
              arguments:
                to: "{{ ref('dim_service') }}"
                field: "code_service"
      - name: etat
        tests:
          - not_null
      - name: montant_total
        tests:
          - not_null
      - name: part_organisme
        tests:
          - not_null
      - name: part_patient
        tests:
          - not_null
      - name: nb_lignes
        tests:
          - not_null
      - name: montant_lignes
        tests:
          - not_null
      - name: agent_creation
        tests:
          - not_null
          - relationships:
              arguments:
                to: "{{ ref('dim_agent') }}"
                field: "code_agent"
      - name: date_creation
        tests:
          - not_null
