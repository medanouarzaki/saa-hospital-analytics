version: 2

models:
  - name: int_relances
    description: >
      source.relances typée : les colonnes date/horodatage/booleen/numérique converties
      par les macros de dbt/macros/conversions.sql, les colonnes code/texte reprises
      telles quelles.
    tests:
      - meme_decompte_que_la_source:
          arguments:
            compare_model: "{{ source('source', 'relances') }}"
      - unique:
          arguments:
            column_name: "n_relance"
    columns:
      - name: date_relance
        tests:
          - conversion_sans_perte:
              arguments:
                source_relation: "{{ source('source', 'relances') }}"
                source_column: date_relance
      - name: date_extraction
        tests:
          - conversion_sans_perte:
              arguments:
                source_relation: "{{ source('source', 'relances') }}"
                source_column: date_extraction
