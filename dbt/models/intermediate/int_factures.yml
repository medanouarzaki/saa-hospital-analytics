version: 2

models:
  - name: int_factures
    description: >
      source.factures typée : les colonnes date/horodatage/booleen/numérique converties
      par les macros de dbt/macros/conversions.sql, les colonnes code/texte reprises
      telles quelles.
    tests:
      - meme_decompte_que_la_source:
          arguments:
            compare_model: "{{ source('source', 'factures') }}"
      - unique:
          arguments:
            column_name: "n_facture"
    columns:
      - name: date_facture
        tests:
          - conversion_sans_perte:
              arguments:
                source_relation: "{{ source('source', 'factures') }}"
                source_column: date_facture
      - name: montant_total
        tests:
          - conversion_sans_perte:
              arguments:
                source_relation: "{{ source('source', 'factures') }}"
                source_column: montant_total
      - name: part_organisme
        tests:
          - conversion_sans_perte:
              arguments:
                source_relation: "{{ source('source', 'factures') }}"
                source_column: part_organisme
      - name: part_patient
        tests:
          - conversion_sans_perte:
              arguments:
                source_relation: "{{ source('source', 'factures') }}"
                source_column: part_patient
      - name: date_creation
        tests:
          - conversion_sans_perte:
              arguments:
                source_relation: "{{ source('source', 'factures') }}"
                source_column: date_creation
      - name: date_extraction
        tests:
          - conversion_sans_perte:
              arguments:
                source_relation: "{{ source('source', 'factures') }}"
                source_column: date_extraction
