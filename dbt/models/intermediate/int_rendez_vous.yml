version: 2

models:
  - name: int_rendez_vous
    description: >
      source.rendez_vous typée : les colonnes date/horodatage/booleen/numérique converties
      par les macros de dbt/macros/conversions.sql, les colonnes code/texte reprises
      telles quelles.
    tests:
      - meme_decompte_que_la_source:
          arguments:
            compare_model: "{{ source('source', 'rendez_vous') }}"
      - unique:
          arguments:
            column_name: "n_rdv"
    columns:
      - name: date_rendez_vous
        tests:
          - conversion_sans_perte:
              arguments:
                source_relation: "{{ source('source', 'rendez_vous') }}"
                source_column: date_rendez_vous
      - name: rdv_supplementaire
        tests:
          - conversion_sans_perte:
              arguments:
                source_relation: "{{ source('source', 'rendez_vous') }}"
                source_column: rdv_supplementaire
      - name: duree
        tests:
          - conversion_sans_perte:
              arguments:
                source_relation: "{{ source('source', 'rendez_vous') }}"
                source_column: duree
      - name: date_reception
        tests:
          - conversion_sans_perte:
              arguments:
                source_relation: "{{ source('source', 'rendez_vous') }}"
                source_column: date_reception
      - name: imprimer_donnees
        tests:
          - conversion_sans_perte:
              arguments:
                source_relation: "{{ source('source', 'rendez_vous') }}"
                source_column: imprimer_donnees
      - name: date_creation
        tests:
          - conversion_sans_perte:
              arguments:
                source_relation: "{{ source('source', 'rendez_vous') }}"
                source_column: date_creation
      - name: date_mod
        tests:
          - conversion_sans_perte:
              arguments:
                source_relation: "{{ source('source', 'rendez_vous') }}"
                source_column: date_mod
      - name: date_conf
        tests:
          - conversion_sans_perte:
              arguments:
                source_relation: "{{ source('source', 'rendez_vous') }}"
                source_column: date_conf
      - name: date_annul
        tests:
          - conversion_sans_perte:
              arguments:
                source_relation: "{{ source('source', 'rendez_vous') }}"
                source_column: date_annul
      - name: date_extraction
        tests:
          - conversion_sans_perte:
              arguments:
                source_relation: "{{ source('source', 'rendez_vous') }}"
                source_column: date_extraction
