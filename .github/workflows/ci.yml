name: ci

on:
  push:
  workflow_dispatch:

jobs:
  lint-and-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - run: uv sync --frozen

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - run: uv run sqlfluff lint --dialect postgres .

      - run: |
          uv run python3 -c '
          import pathlib
          import re
          import subprocess

          fichiers = [p for p in pathlib.Path("tests").glob("*.py") if p.name != "test_provenance.py"]
          n_independant = sum(
              len(re.findall(r"(?m)^def test_", p.read_text(encoding="utf-8"))) for p in fichiers
          )

          resultat = subprocess.run(
              ["uv", "run", "pytest", "tests/", "--ignore=tests/test_provenance.py", "--collect-only", "-q"],
              capture_output=True,
              text=True,
              check=True,
          )
          n_collecte = int(re.search(r"(\d+) tests? collected", resultat.stdout).group(1))

          assert n_independant == n_collecte, (
              f"collecte pytest ({n_collecte}) != fonctions test_ comptees independamment "
              f"({n_independant}) : un fichier de test est probablement mal nomme"
          )
          print(f"controle de collecte : {n_collecte} tests, en accord avec le compte independant")
          '

      - run: uv run pytest tests/test_collecte_ci.py -v

  tests-matrice:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        groupe:
          - nom: doublons
            fichiers: >-
              tests/test_doublons.py

          - nom: defauts-facturation-mouvements-sources
            fichiers: >-
              tests/test_defauts.py
              tests/test_facturation.py
              tests/test_mouvements.py
              tests/test_sources.py

          - nom: passages-perf-recouvrement-sensibilite-temporel
            fichiers: >-
              tests/test_passages.py
              tests/test_performance_configuration.py
              tests/test_recouvrement.py
              tests/test_sensibilite.py
              tests/test_temporel.py

          - nom: invariants-rdv-volumes-et-fichiers-courts
            fichiers: >-
              tests/test_aucune_trace_processus.py
              tests/test_config_generateur.py
              tests/test_ecriture.py
              tests/test_generator_cli.py
              tests/test_invariants_tables.py
              tests/test_nomenclatures.py
              tests/test_prises_en_charge.py
              tests/test_relations_injectees.py
              tests/test_rendez_vous.py
              tests/test_volumes.py

          - nom: coherence-parcours-patients-urgences-et-fichiers-courts
            fichiers: >-
              tests/test_aucune_image.py
              tests/test_calendrier.py
              tests/test_coherence_inter_tables.py
              tests/test_controles.py
              tests/test_parcours.py
              tests/test_patients.py
              tests/test_relations.py
              tests/test_urgences.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - run: uv sync --frozen

      - run: uv run pytest ${{ matrix.groupe.fichiers }} -v -s

  provenance:
    runs-on: ubuntu-latest
    # Le service n'exige aucun mot de passe : le conteneur est éphémère,
    # joignable depuis le seul job qui l'a démarré, et aucun identifiant
    # n'existe donc qui pourrait fuir.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - run: uv sync --frozen

      - run: uv run python ingestion/appliquer_ddl.py

      - run: uv run pytest tests/test_provenance.py tests/test_quarantaine_schema.py tests/test_chargeur.py -v
