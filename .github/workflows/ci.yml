name: ci

on:
  push:
  workflow_dispatch:

jobs:
  lint-and-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - run: uv sync --frozen

      - run: uv run ruff check .

      - run: uv run sqlfluff lint --dialect postgres .

      - run: uv run pytest tests/test_aucune_image.py -v

      - run: uv run pytest tests/test_sources.py -v -s

      - run: uv run pytest tests/test_relations.py -v

      - run: uv run pytest tests/test_aucune_trace_processus.py -v
