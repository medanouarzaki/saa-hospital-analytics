name: ci

on:
  push:
  workflow_dispatch:

jobs:
  lint-and-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - run: uv sync --frozen

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - run: uv run sqlfluff lint --dialect postgres .

      - run: |
          # Un heredoc à délimiteur quotté ("PYEOF" entre apostrophes), pas
          # `python3 -c '...'` : le corps d'un tel heredoc est repris
          # littéralement par bash, apostrophe comprise — `python3 -c '...'`
          # se serait terminé prématurément à la première apostrophe d'un
          # commentaire français ci-dessous (mesuré : actionlint + shellcheck
          # signalaient une chaîne bash refermée trop tôt, qui aurait fait
          # échouer ce job dès son analyse par GitHub Actions).
          uv run python3 - <<'PYEOF'
          import pathlib
          import re
          import subprocess

          fichiers = [p for p in pathlib.Path("tests").glob("*.py") if p.name != "test_provenance.py"]
          comptes_independants = {
              p.name: len(re.findall(r"(?m)^def test_", p.read_text(encoding="utf-8")))
              for p in fichiers
          }

          resultat = subprocess.run(
              ["uv", "run", "pytest", "tests/", "--ignore=tests/test_provenance.py", "--collect-only", "-q"],
              capture_output=True,
              text=True,
              check=True,
          )
          # Compte par fichier, pas un total global : un total global masque
          # une inégalité par excès dans un fichier compensée par un déficit
          # dans un autre. La comparaison est >= (pas ==) par fichier : la
          # paramétrisation (pytest.mark.parametrize) multiplie légitimement
          # le nombre d'éléments collectés au-delà du nombre de "def test_",
          # ce n'est jamais le défaut recherché (un fichier mal nommé ou non
          # découvert donnerait 0 collecté pour un compte independant > 0).
          comptes_collectes: dict[str, int] = {}
          for ligne in resultat.stdout.splitlines():
              prefixe = "tests" + "/"
              if "::" not in ligne or not ligne.startswith(prefixe):
                  continue
              nom = pathlib.Path(ligne.split("::", 1)[0]).name
              comptes_collectes[nom] = comptes_collectes.get(nom, 0) + 1

          for nom, n_independant in comptes_independants.items():
              n_collecte = comptes_collectes.get(nom, 0)
              assert n_collecte >= n_independant, (
                  f"{nom} : {n_independant} fonction(s) test_ mais seulement {n_collecte} "
                  "collectee(s) par pytest : le fichier est probablement mal nomme ou non decouvert"
              )
          print(
              f"controle de collecte : {len(comptes_independants)} fichier(s) de test, "
              "chacun avec au moins son compte independant de fonctions test_ collecte"
          )
          PYEOF

      - run: uv run pytest tests/test_collecte_ci.py -v

      # L'index des enregistrements de décision : il ne lit que des fichiers, aucune base. Sa place
      # est donc l'emplacement qui n'en démarre aucune.
      - run: uv run pytest tests/test_index_des_decisions.py -v

      # Les marqueurs nominatifs du rapport, et la structure de ses sources. Les deux lisent des
      # FICHIERS, jamais le PDF : leurs propriétés ne dépendent pas de la compilation, et leur place
      # n'est donc pas le travail qui compile.
      - run: uv run pytest tests/test_marqueurs_nominatifs.py tests/test_structure_du_rapport.py -v

      # La provenance des affirmations du rapport. Ce contrôle lit les fichiers de chapitre, le fichier
      # bibliographique produit et le registre des sources : aucune base, aucune compilation. Sa place est
      # donc ici, avec les deux précédents, et non dans le travail qui compile.
      - run: uv run pytest tests/test_provenance_des_chapitres.py -v

      # Le rendu Markdown du relevé de champs, confronté à ce que son générateur produit. Il ne lit que
      # deux fichiers et n'ouvre aucune base : sa place est ici.
      - run: uv run pytest tests/test_releve_markdown_synchrone.py -v

      # Le registre des chiffres, confronté au rapport et à son rendu. Ce contrôle n'ouvre aucune base :
      # il vérifie que chaque nombre appelé existe, que chaque entrée sert ou porte son motif, et que le
      # rendu correspond au registre. Que les valeurs soient celles que les commandes rendent relève de
      # `docs/chiffres/mesurer.py --verifier`, qui exige la période entière.
      - run: uv run pytest tests/test_registre_des_chiffres.py -v

      # La correspondance entre les relations injectées et les conclusions du chapitre d'analyse,
      # dans les deux sens. Ce contrôle lit deux FICHIERS — le registre des relations et la source
      # du chapitre — et n'ouvre aucune base : sa place est ici, avec les autres contrôles de
      # sources du rapport, et non dans un emplacement qui démarre un service.
      - run: uv run pytest tests/test_correspondance_relations_conclusions.py -v

  tests-matrice:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        groupe:
          - nom: doublons
            fichiers: >-
              tests/test_doublons.py
              tests/test_linkage_champs.py
              tests/test_linkage_chemins_sortie.py
              tests/test_linkage_modele.py
              tests/test_linkage_normalisation.py

          - nom: defauts-facturation-mouvements-sources
            fichiers: >-
              tests/test_defauts.py
              tests/test_facturation.py
              tests/test_mouvements.py
              tests/test_sources.py

          - nom: passages-perf-recouvrement-sensibilite-temporel
            fichiers: >-
              tests/test_passages.py
              tests/test_performance_configuration.py
              tests/test_recouvrement.py
              tests/test_sensibilite.py
              tests/test_temporel.py

          - nom: invariants-rdv-volumes-et-fichiers-courts
            fichiers: >-
              tests/test_aucune_trace_processus.py
              tests/test_config_generateur.py
              tests/test_ecriture.py
              tests/test_generator_cli.py
              tests/test_invariants_tables.py
              tests/test_nomenclatures.py
              tests/test_prises_en_charge.py
              tests/test_relations_injectees.py
              tests/test_rendez_vous.py
              tests/test_structure_graphe.py
              tests/test_volumes.py

          - nom: coherence-parcours-patients-urgences-et-fichiers-courts
            fichiers: >-
              tests/test_aucune_image.py
              tests/test_calendrier.py
              tests/test_coherence_inter_tables.py
              tests/test_controles.py
              tests/test_parcours.py
              tests/test_patients.py
              tests/test_relations.py
              tests/test_urgences.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - run: uv sync --frozen

      - run: uv run pytest ${{ matrix.groupe.fichiers }} -v -s

  provenance:
    runs-on: ubuntu-latest
    # Le service n'exige aucun mot de passe : le conteneur est éphémère,
    # joignable depuis le seul job qui l'a démarré, et aucun identifiant
    # n'existe donc qui pourrait fuir.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - run: uv sync --frozen

      - run: uv run python ingestion/appliquer_ddl.py

      # test_ddl_idempotent.py siège ici et nulle part ailleurs : c'est le seul job qui
      # dispose à la fois d'une base et de l'étape qui applique la définition de schéma.
      # Il n'exige pas cette étape — il se crée sa propre base jetable et applique la
      # définition dessus — mais il exige un serveur, que seuls les jobs à service en ont.
      - run: uv run pytest tests/test_provenance.py tests/test_quarantaine_schema.py tests/test_chargeur.py tests/test_ddl_idempotent.py -v

  dbt:
    runs-on: ubuntu-latest
    # Calque du service du job provenance : même image, mêmes options de santé, aucun mot
    # de passe puisque le conteneur est éphémère et propre à ce job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ""
      # Ce job démarre son propre service postgres, éphémère et propre à cette exécution :
      # tests/test_idempotence.py, tests/test_rattrapage.py et tests/test_controle_qualite.py,
      # qui détruisent, rejouent ou construisent des partitions, peuvent donc s'exécuter contre
      # lui sans risque.
      SAA_INSTRUMENT_JETABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - run: uv sync --frozen

      - run: uv run python -m generator "$RUNNER_TEMP/scenario" --date-fin 2024-03-31

      # Chemin de la vérité terrain réellement générée par l'étape ci-dessus
      # (sous $RUNNER_TEMP/scenario/, jamais generator/output/ : voir
      # linkage/evaluation.py et les fichiers de test linkage qui la lisent).
      # Écrit dans GITHUB_ENV, pas dans un bloc "env:" de job (le contexte
      # "runner" n'y est pas autorisé — seul le contexte "github" et
      # quelques autres le sont ; "runner" n'existe que dans les étapes) :
      # ainsi toutes les étapes suivantes de ce job en héritent, pas
      # seulement test_dim_patient.py.
      - run: echo "VERITE_TERRAIN_PATIENTS=$RUNNER_TEMP/scenario/scenario_30/verite_terrain.yml" >> "$GITHUB_ENV"

      # Racine du scénario et emplacement du graphe, pour tests/test_idempotence.py,
      # tests/test_rattrapage.py et tests/test_controle_qualite.py (exécutés en fin de job, une
      # fois la chaîne complète déjà rejouée une première fois) : mêmes variables que celles
      # lues par `airflow/saa_daily.py` en exécution normale. AIRFLOW_HOME sous le répertoire
      # temporaire de l'exécuteur : métadonnées de l'orchestrateur exclusives à ce job,
      # jamais persistées.
      # La dernière redirige la courbe précision/rappel hors de l'arbre de travail : sans elle,
      # `linkage.evaluation` réécrit un fichier SUIVI à chaque exécution — mesuré : 73 lignes sur
      # 74 modifiées, `git status` sale en fin de job. La variable est celle que le module lit
      # lui-même ; aucune n'est inventée ici.
      #
      # `linkage/ablation.csv` n'est PAS redirigé, et c'est mesuré : `linkage.ablation` lit bien
      # `CHEMIN_CSV_ABLATION`, mais tests/test_linkage_ablation.py:22 ouvre le chemin par défaut en
      # dur. Rediriger le module laisse donc ce contrôle lire le fichier commis, périmé — mesuré :
      # `assert 991 == 115`, le décompte du fichier versionné contre celui du jeu de ce job. La
      # dette reste ouverte : elle se solde du côté du contrôle, pas du fichier de workflow.
      - run: |
          {
            echo "SAA_SCENARIO_ROOT=$RUNNER_TEMP/scenario/scenario_30"
            echo "AIRFLOW_HOME=$RUNNER_TEMP/airflow_home"
            echo "AIRFLOW__CORE__DAGS_FOLDER=$GITHUB_WORKSPACE/airflow"
            echo "CHEMIN_COURBE_PRECISION_RAPPEL=$RUNNER_TEMP/courbe_precision_rappel.csv"
          } >> "$GITHUB_ENV"

      - run: uv run python ingestion/appliquer_ddl.py

      - run: uv run python -m linkage.appliquer_ddl

      - run: uv run pytest tests/test_linkage_schema.py -v

      - run: uv run python -m ingestion.chargeur "$RUNNER_TEMP/scenario/scenario_30"

      - run: |
          mkdir -p "$RUNNER_TEMP/dbt_profiles"
          cat > "$RUNNER_TEMP/dbt_profiles/profiles.yml" <<'PROFILE'
          saa_hospital_analytics:
            target: dev
            outputs:
              dev:
                type: postgres
                host: "{{ env_var('DBT_POSTGRES_HOST', 'localhost') }}"
                port: "{{ env_var('DBT_POSTGRES_PORT', '5432') | as_number }}"
                user: "{{ env_var('DBT_POSTGRES_USER', 'postgres') }}"
                password: "{{ env_var('DBT_POSTGRES_PASSWORD', '') }}"
                dbname: "{{ env_var('DBT_POSTGRES_DB', 'postgres') }}"
                schema: intermediate
                threads: 4
          PROFILE

      - run: cd dbt && uv run dbt seed
        env:
          DBT_PROFILES_DIR: ${{ runner.temp }}/dbt_profiles

      - run: cd dbt && uv run dbt run --threads 1
        env:
          DBT_PROFILES_DIR: ${{ runner.temp }}/dbt_profiles

      - run: cd dbt && uv run dbt test
        env:
          DBT_PROFILES_DIR: ${{ runner.temp }}/dbt_profiles

      # Placé immédiatement après la construction dbt, et dans ce job plutôt qu'un autre : ce
      # contrôle interrogeant le catalogue de la base pour y lire les colonnes réellement
      # présentes des couches intermediate et marts, sa précondition est que ces deux couches
      # existent. C'est l'étape ci-dessus qui l'établit — aucun autre emplacement de la chaîne ne
      # la fournit plus tôt, et l'ordre des étapes la rend ici explicite.
      - run: uv run pytest tests/test_documentation_couches_aval.py -v


      - run: uv run pytest tests/test_dim_patient.py -v

      - run: uv run pytest tests/test_delai_rendez_vous.py tests/test_indicateurs_sejour.py -v

      # L'appariement de un à un entre le fait de séjour et le passage d'hospitalisation. Il exige
      # la couche marts, que la construction dbt de ce job établit ; sa propriété est structurelle
      # et vaut donc sur la fenêtre réduite que cet emplacement charge.
      - run: uv run pytest tests/test_faits_sejour_et_passage.py -v

      - run: uv run pytest tests/test_linkage_population.py -v

      - run: uv run pytest tests/test_linkage_blocage.py -v

      - run: uv run pytest tests/test_linkage_estimation.py -v

      - run: uv run python -m linkage.prediction

      - run: uv run pytest tests/test_linkage_prediction.py -v

      - run: uv run pytest tests/test_linkage_regroupement.py -v

      - run: uv run python -m linkage.evaluation

      - run: uv run pytest tests/test_linkage_evaluation.py -v

      # Aucune étape de chaîne ne doit modifier un fichier SUIVI. `git diff --exit-code` « exits
      # with 1 if there were differences and 0 means no differences » (aide de la version
      # installée) ; `--stat` nomme le fautif dans le journal du job avant de rendre ce code, et
      # `git status --porcelain` ajoute ce qu'aucun `diff` ne voit : un fichier non suivi apparu.
      #
      # Placée AVANT l'étude d'ablation, et non en fin de chaîne : cette étude écrit un fichier
      # suivi qu'on ne peut pas rediriger sans aveugler son propre contrôle (voir le motif de la
      # redirection, plus haut). Le garde couvre donc tout ce qui la précède ; l'écriture de
      # l'ablation reste la dette consignée, et rien d'autre ne lui échappe.
      - run: |
          git diff --stat --exit-code
          git diff --stat --exit-code --cached
          test -z "$(git status --porcelain)"

      - run: uv run python -m linkage.ablation

      - run: uv run pytest tests/test_linkage_ablation.py -v

      # Idempotence et rattrapage : réutilisent le graphe et le jeu de données déjà en place
      # dans ce job plutôt que d'en reconstituer un second — leur place naturelle est ici, pas
      # un job séparé (cette économie n'a pas été mesurée contre le coût de l'isolement).
      - run: uv run pytest tests/test_idempotence.py -v
        env:
          DBT_PROFILES_DIR: ${{ runner.temp }}/dbt_profiles

      - run: uv run pytest tests/test_rattrapage.py -v
        env:
          DBT_PROFILES_DIR: ${{ runner.temp }}/dbt_profiles

      - run: uv run pytest tests/test_controle_qualite.py -v

      # Le registre des indicateurs confronte les objets qu'il cite au catalogue : sa place est
      # dans un emplacement où la couche marts est construite, et celui-ci en est un. Les sept
      # autres propriétés qu'il vérifie n'exigent que le fichier, et restent au même endroit pour
      # que le registre ne soit pas contrôlé à deux endroits.
      - run: uv run pytest tests/test_registre_indicateurs.py -v

  # Quatrième emplacement, détaché de `dbt` par la mesure et non par intuition. Les quatre
  # fichiers de contrôle qu'il porte partagent une précondition que les autres n'ont pas :
  # l'instantané, qu'ils rafraîchissent eux-mêmes. Leur durée propre mesurée les classe aux
  # premiers rangs de l'emplacement d'origine, dont la marge jusqu'au plus court groupe de la
  # matrice était tombée à 17 s (544 s contre 561 s, mesurés sur la dernière exécution). Les
  # laisser là aurait fait dépasser cette marge, et chaque contrôle d'instantané, de tableau de
  # bord ou de livrable ajouté ensuite l'aurait creusée davantage.
  #
  # Cet emplacement reconstruit ses préconditions au lieu de les hériter : il ne rejoue ni les
  # contrôles dbt, ni le rapprochement au complet — seulement ce que l'instantané copie
  # (`marts`, les trois tables de `linkage`, `intermediate.int_creances`), soit la construction
  # dbt, la prédiction et l'évaluation. L'ablation n'écrit aucune table que l'instantané reprenne
  # et n'y figure donc pas.
  instantane:
    runs-on: ubuntu-latest
    # Calque du service des jobs provenance et dbt : même image, mêmes options de santé, aucun
    # mot de passe puisque le conteneur est éphémère et propre à ce job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - run: uv sync --frozen

      - run: uv run python -m generator "$RUNNER_TEMP/scenario" --date-fin 2024-03-31

      # L'évaluation du rapprochement lit la vérité terrain réellement générée ci-dessus, sous
      # $RUNNER_TEMP/scenario/ et jamais generator/output/ — même raison que dans le job dbt. La
      # seconde variable redirige sa courbe précision/rappel hors de l'arbre de travail : sans
      # elle, ce job réécrit un fichier suivi — mesuré ici même, `git status` sale en fin de job.
      - run: |
          {
            echo "VERITE_TERRAIN_PATIENTS=$RUNNER_TEMP/scenario/scenario_30/verite_terrain.yml"
            echo "CHEMIN_COURBE_PRECISION_RAPPEL=$RUNNER_TEMP/courbe_precision_rappel.csv"
          } >> "$GITHUB_ENV"

      - run: uv run python ingestion/appliquer_ddl.py

      - run: uv run python -m linkage.appliquer_ddl

      - run: uv run python -m ingestion.chargeur "$RUNNER_TEMP/scenario/scenario_30"

      - run: |
          mkdir -p "$RUNNER_TEMP/dbt_profiles"
          cat > "$RUNNER_TEMP/dbt_profiles/profiles.yml" <<'PROFILE'
          saa_hospital_analytics:
            target: dev
            outputs:
              dev:
                type: postgres
                host: "{{ env_var('DBT_POSTGRES_HOST', 'localhost') }}"
                port: "{{ env_var('DBT_POSTGRES_PORT', '5432') | as_number }}"
                user: "{{ env_var('DBT_POSTGRES_USER', 'postgres') }}"
                password: "{{ env_var('DBT_POSTGRES_PASSWORD', '') }}"
                dbname: "{{ env_var('DBT_POSTGRES_DB', 'postgres') }}"
                schema: intermediate
                threads: 4
          PROFILE

      - run: cd dbt && uv run dbt seed
        env:
          DBT_PROFILES_DIR: ${{ runner.temp }}/dbt_profiles

      - run: cd dbt && uv run dbt run --threads 1
        env:
          DBT_PROFILES_DIR: ${{ runner.temp }}/dbt_profiles

      - run: uv run python -m linkage.prediction

      - run: uv run python -m linkage.evaluation

      # Aucune étape de chaîne ne doit modifier un fichier SUIVI. `git diff --exit-code` « exits
      # with 1 if there were differences and 0 means no differences » (aide de la version
      # installée) ; `--stat` nomme le fautif dans le journal du job avant de rendre ce code.
      # Placée ici : toutes les commandes qui écrivent des artefacts sont au-dessus, et rien de ce
      # qui suit ne modifie légitimement l'arbre — un rouge désigne donc un artefact échappé.
      - run: |
          git diff --stat --exit-code
          git diff --stat --exit-code --cached
          test -z "$(git status --porcelain)"

      # Aucune étape ne rafraîchit l'instantané avant les contrôles : ils l'établissent
      # eux-mêmes, un test devant poser ses préconditions plutôt que les hériter de l'ordre des
      # étapes qui le précèdent. Les quatre fichiers restent en étapes séparées, comme dans le
      # job dbt : une exécution en échec nomme alors le fichier fautif dans le nom de l'étape.
      - run: uv run pytest tests/test_instantane.py -v

      # Les commandes du registre des chiffres, exécutées SANS comparer leurs valeurs. L'exécuteur
      # génère une fenêtre de trois mois là où le registre est mesuré sur la période entière : aucune
      # comparaison de valeurs n'y a de sens, et une comparaison rougirait toujours. Ce que ce mode
      # prouve, et c'est déjà beaucoup, est qu'aucune commande n'a été cassée par une évolution du
      # schéma.
      #
      # CET EMPLACEMENT EST LE SEUL POSSIBLE, ET IL A CHANGÉ. Le registre a d'abord vécu dans le
      # travail `dbt`, déplacé une première fois après l'évaluation du rapprochement, qui est la
      # première étape à peupler `linkage.grappes_identite` et `linkage.evaluation`. Il lit
      # maintenant AUSSI le schéma d'instantané — quatre indicateurs réglementaires tels que la page
      # les affiche, la table de paramètres, la table d'état — et le travail `dbt` ne rafraîchit
      # jamais ce schéma. Mesuré, et non supposé :
      #
      #     psycopg.errors.UndefinedTable: relation "instantane.instantane_etat" does not exist
      #
      # Cet emplacement-ci est le seul qui réunisse les six schémas que le registre interroge :
      # `source` et `quarantaine` par le chargement, `intermediate` et `marts` par la construction
      # dbt, `linkage` par la prédiction et l'évaluation, et `instantane` par l'étape ci-dessus,
      # qui est la première à le rafraîchir.
      #
      # CE MODE COUVRE AUSSI LES SÉRIES, et il ne les ÉCRIT PAS : seul `--ecrire-series` écrit les
      # fichiers de données, et il ne s'exécute jamais ici. Ce que ce mode prouve d'une série est
      # que sa commande s'exécute encore et rend exactement les colonnes déclarées — leur nom pour
      # une commande SQL, leur nombre pour une commande python, qui ne les nomme pas. Que le fichier
      # lu soit celui que la commande produit relève de tests/test_registre_des_chiffres.py, et que
      # l'empreinte du registre soit celle de la commande relève de `--verifier`, qui exige la
      # période entière.
      - run: uv run python3 docs/chiffres/mesurer.py --formes

      # La transparence du rafraîchissement se mesure sous témoin concurrent : ces contrôles
      # lancent des rafraîchissements réels et lisent en boucle pendant qu'ils se déroulent.
      - run: uv run pytest tests/test_instantane_transparence.py -v

      # test_libelles_dimensions.py siège ici : il rend des pages et interroge le schéma
      # d'instantané, que ce job est le seul à rafraîchir. Il n'a pas de dépendance à
      # l'ordre des fichiers de cette commande.
      - run: uv run pytest tests/test_tableau_de_bord.py tests/test_libelles_dimensions.py -v

      # Même emplacement que le contrôle précédent, et pour la même précondition — l'instantané,
      # que les pages lisent. Ce contrôle-ci rend chaque page dans un processus fils dont le chemin
      # d'import est celui du service, et non celui de pytest : la racine du dépôt n'y figure que
      # si les fichiers de `docker/` l'y mettent. C'est la seule position de la chaîne où les deux
      # conditions sont réunies, l'instantané étant absent des autres emplacements.
      - run: uv run pytest tests/test_tableau_de_bord_contexte_conteneur.py -v

      # Les quatre indicateurs de séjour tels que la page les affiche. Sa place est ici et nulle
      # part ailleurs : il lui faut l'instantané, que seul cet emplacement rafraîchit, et la couche
      # marts, que la construction dbt de ce même job établit — il compare les deux.
      - run: uv run pytest tests/test_indicateurs_sejour_affiches.py -v

      # La correspondance entre ce que le registre déclare et ce que les pages lisent, et les trois
      # indicateurs qu'aucune seconde mesure ne touchait. Les deux rendent des pages contre le
      # schéma d'instantané : leur place est cet emplacement, le seul qui le rafraîchisse.
      - run: uv run pytest tests/test_correspondance_registre_usage.py tests/test_indicateurs_sans_seconde_mesure.py -v

      # Les contrôles des livrables produisent l'export puis LISENT les fichiers produits.
      - run: uv run pytest tests/test_exports.py -v

      # test_echantillon.py siège ici : trois de ses propriétés n'interrogent aucune base et
      # s'exécutent partout — dont celle qui vérifie la mention portée par chaque ligne, la
      # seule qui protège la publication. Les deux autres confrontent l'échantillon aux tables
      # dont il est extrait, et s'abstiennent avec un motif explicite sur la fenêtre réduite
      # que ce job charge, l'échantillon étant tiré du jeu complet.
      - run: uv run pytest tests/test_echantillon.py -v

      # test_disjonction_structurelle.py siège ici et à un seul endroit. Il lui faut les deux
      # à la fois : une couche source PEUPLÉE — le job provenance applique la définition de
      # schéma sans charger de données, et ses tables sont vides — et les fichiers versés au
      # dépôt, qu'il lit sur l'arbre de travail. La fenêtre réduite que ce job charge ne le
      # gêne pas : il porte sur la FORME de chaque valeur, jamais sur leur nombre.
      - run: uv run pytest tests/test_disjonction_structurelle.py -v

  # La compilation du rapport et de la présentation, et leur publication en artefacts.
  #
  # La chaîne typographique n'est PAS installée étape par étape : `xu-cheng/latex-action` exécute la
  # compilation dans une image qui porte déjà une distribution TeX Live complète. Installer une
  # distribution par le gestionnaire de paquets de l'exécuteur prendrait plusieurs minutes à chaque
  # exécution, quand le groupe le plus long de la matrice est déjà à seize minutes ; une image
  # préconstruite ne coûte que son téléchargement.
  #
  # Ce travail ne démarre aucun service et ne lit aucune base : il ne dépend d'aucun autre et
  # s'exécute en parallèle des neuf autres.
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `args` reprend la valeur par défaut de l'action, citée dans sa documentation :
      # `-pdf -file-line-error -halt-on-error -interaction=nonstopmode`. Elle est écrite ici plutôt
      # qu'héritée pour que `-halt-on-error` soit visible : c'est lui qui fait échouer le travail sur
      # la première erreur de compilation, au lieu de produire un PDF amputé.
      #
      # `latexmk` appelle `biber` de lui-même dès qu'il voit le fichier de contrôle que biblatex
      # produit ; aucune étape de bibliographie n'est donc à écrire.
      - name: Compiler le rapport
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4.1.0
        with:
          root_file: rapport.tex
          working_directory: report
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Compiler la présentation
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4.1.0
        with:
          root_file: presentation.tex
          working_directory: slides
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapport
          path: report/rapport.pdf
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: presentation
          path: slides/presentation.pdf
          if-no-files-found: error
