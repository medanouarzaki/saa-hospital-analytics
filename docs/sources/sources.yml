# Registre des sources
#
# Deux vérifications distinctes coexistent dans ce fichier et ne doivent pas
# être confondues :
#   - le champ `verification` porte sur le CONTENU, établi par lecture ;
#   - le contrôle HTTP de tests/test_sources.py porte sur la VIE DE L'URL.
# Une source peut satisfaire l'une sans l'autre. Le Bulletin Officiel n° 5926
# en est l'illustration : URL vivante, contenu inaccessible car scanné.
#
# Règle de numérotation : un document, un identifiant. Une source primaire
# officielle et la reprise de presse qui l'a corroborée portent deux
# identifiants distincts.
#
# Les dix champs id, titre, auteur, type, url, date_publication,
# date_consultation, fiabilite, verification, utilise_pour sont présents
# dans chaque entrée et aucune valeur n'est vide. Deux champs admettent une
# valeur littérale déclarant une absence légitime plutôt qu'un oubli :
#   - date_publication peut valoir non_datee ;
#   - url peut valoir sans_url, uniquement si verification vaut introuvable.
# Champs facultatifs, dont la clé peut être absente : note, doublon_de,
# remplace_par.

