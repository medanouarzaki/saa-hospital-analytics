- id: S-12
  titre: "Améliorer la prise en charge des urgences médicales pour préserver et sauver des vies et contribuer à assurer des soins de qualité pour tous"
  auteur: "Conseil Économique, Social et Environnemental"
  type: avis d'institution publique
  url: https://www.cese.ma/wp-content/uploads/2023/10/ebook-Avis-urgences-medicales-au-Maroc-vf.pdf
  date_publication: "2023-03-30"
  date_consultation: "2026-08-08"
  fiabilite: officielle
  verification: contenu_lu
  utilise_pour: "6 482 185 consultations et soins d'urgence par an dans le public. 25 % des hospitalisations et 47 % des cas opérés en 2021 issus des urgences. Urgences vitales 10 %, consultations non urgentes 64 %. Hospitalisation dans 13 % des cas aux polycliniques CNSS. 148 services d'urgence dont 94 de base."
  note: "Le cadrage initial portait une autre adresse, sous /media/2023/06/. Elle répond, mais son contenu n'a pas été lu. L'adresse retenue ici est celle dont le contenu a été effectivement vérifié."

- id: S-13
  titre: "Les consultations non appropriées aux services des urgences : étude dans un hôpital provincial au Maroc"
  auteur: "Berraho M., Boly A., Tachfouti N. et al."
  type: article académique
  url: https://doi.org/10.3917/pos.433.0197
  date_publication: "2012-09-24"
  date_consultation: "2026-08-08"
  fiabilite: academique
  verification: contenu_lu
  utilise_pour: "30,7 % de consultations non appropriées sur 410 patients au CHP de Nador, 2010. Répartition des motifs de recours par chapitre CIM-10."
  note: "Le corps de l'article et son résumé donnent en sens inverse la relation entre couverture sociale et caractère approprié du recours. Cette contradiction interne est signalée et aucun champ ne s'y adosse. Étude antérieure à la généralisation de l'AMO."

- id: S-14
  titre: "Triage des patients à l'accueil d'une structure d'urgences. Présentation de l'échelle FRench Emergency Nurses Classification in Hospital (FRENCH)"
  auteur: "Taboulet P., Maillard-Acker C., Ranchon G. et al., Société française de médecine d'urgence"
  type: article académique
  url: https://stm.cairn.info/article/FMU_091_0051
  date_publication: "2019"
  date_consultation: "2026-08-08"
  fiabilite: academique
  verification: contenu_lu
  utilise_pour: "Six niveaux de tri, le niveau 3 étant scindé en 3A et 3B selon la comorbidité ou l'adressage par un médecin. Délais maximaux avant prise en charge médicale : 1, 20, 60, 90, 120 et 240 minutes. Taux d'hospitalisation par niveau : 80,9 %, 59,6 %, 25,5 %, 4,0 % et 1,7 %."
  note: "Échelle française. Sa transposition au contexte marocain est une hypothèse, distincte de la validité des valeurs publiées."

