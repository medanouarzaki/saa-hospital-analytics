  provenance: HYP
  preuve: sans_preuve_externe
  note: "L'écran de la fiche patient porte un champ Modifié par sans horodatage adjacent, là où l'écran de rendez-vous appareille chaque agent à sa date. La colonne est posée parce que l'historisation de la dimension patient en type 2 exige un instant de changement. Si l'extraction réelle ne la fournissait pas, l'historisation se rabattrait sur la date d'extraction de la partition, à la granularité du jour au lieu de la seconde, et les changements survenus le même jour seraient confondus."
- table: source.patients
  colonne: date_extraction
  type: text
  type_metier: date
  libelle_hosix: non_releve
  provenance: HYP
  preuve: sans_preuve_externe
  note: "Colonne technique de la zone d'atterrissage, absente du système observé. Elle porte la date de l'extraction dont la ligne provient et rend le rechargement d'une partition idempotent. Si une extraction réelle ne la fournissait pas, elle serait dérivée du nom du fichier partitionné, sans perte d'information."

- table: source.rendez_vous
  colonne: n_rdv
  type: text
  type_metier: code
  libelle_hosix: non_releve
  provenance: HYP
  preuve: sans_preuve_externe
  note: "Aucun identifiant de rendez-vous n'apparaît à l'écran Donner rendez-vous, dont la barre d'actions comporte pourtant Enregistrer, Supprimer et Chercher, trois opérations qui supposent une clé. La colonne est posée parce que la table des passages porte une référence de rendez-vous nullable, qui n'aurait pas de cible sans elle. Si le système en place clé le rendez-vous par un couple agenda et horodatage plutôt que par un numéro, la structure logique du modèle est inchangée et seule la forme de la clé diffère."
