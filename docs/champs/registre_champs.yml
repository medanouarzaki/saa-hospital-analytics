# Registre des champs — colonnes de la couche source
#
# Règle de preuve. Un champ `OBS` porte un identifiant de ligne du relevé de
# champs (`docs/observation/releve_champs.yml`). Un champ `DOC` porte un
# identifiant du registre des sources (`docs/sources/sources.yml`). Un champ
# `HYP` porte une justification écrite et l'effet qu'aurait une hypothèse
# fausse.
#
# `type` vaut `text` sur toute colonne du schéma `source`, sans exception.
# Ce n'est pas un défaut de typage : la couche source reproduit une
# extraction avec ses défauts, et une ligne mal formée doit se charger pour
# partir ensuite en quarantaine. Le typage strict et la standardisation des
# dates appartiennent à la couche intermédiaire. Si PostgreSQL rejetait la
# ligne au chargement, le dispositif de quarantaine n'aurait plus d'objet.
#
# Lignes du relevé qui n'entrent pas au modèle, et pourquoi :
#   - REL-PAT.D07 Âge — dérivable de la date de naissance, ne se stocke pas ;
#   - REL-PAT.D08 et REL-RDV.I08 Num — libellé relevé, nature de la donnée
#     non observée ; une colonne dont le contenu est inconnu ne se modélise
#     pas ;
#   - REL-RDV.I02 à REL-RDV.I07, REL-RDV.I09, REL-RDV.I10 — le bloc
#     d'identification de l'écran de rendez-vous rappelle des données du
#     dossier patient ; elles sont affichées, non saisies, et appartiennent
#     à source.patients.

