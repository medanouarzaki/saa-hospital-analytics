    as jours_annee, max(valeur::numeric) filter (where nom='nombre_jours_periode') as jours_periode
    from instantane.instantane_parametres), b as (select (select max(date_reference_donnees) from
    instantane.instantane_etat) as censure), m as (select count(*) as sejours, sum(extract(epoch
    from (coalesce(date_heure_sortie, ((select censure from b) + time '23:59:59') at time zone
    'UTC') - date_heure_admission)) / 86400.0) as journees from instantane.fct_sejour) select
