# Registre des chiffres — un nombre du rapport par entrée, une entrée par nombre
#
# Règle de preuve. AUCUN NOMBRE N'EST TAPÉ DANS LE RAPPORT. Chaque valeur qu'un
# chapitre affirme vit ici, avec la commande exacte qui la produit, et le texte
# l'appelle par son identifiant. Un nombre écrit en clair dans une source du
# rapport est un nombre que plus rien ne rattache à une mesure.
#
# Le motif est mesuré et non théorique : cinq valeurs ont circulé dans les
# documents de ce projet sans être rattachées à une commande, et les cinq
# étaient fausses ou périmées — un total de lignes décrivant une génération
# écrasée, un décompte de personnes confondu avec un décompte d'identifiants,
# un mot recouvrant deux grandeurs différentes, un décompte de paramètres
# dépassé, et un taux d'occupation qu'aucun artefact ne portait.
#
# Champs de chaque entrée :
#   id        identifiant employé par le rapport, en minuscules et tirets ;
#   valeur    la valeur consignée, telle que la commande l'a rendue ;
#   unite     l'unité ou le format d'affichage ;
#   type      `sql` ou `python` — comment la commande s'exécute ;
#   commande  la commande EXACTE, reproductible telle quelle ;
#   portee    `periode-entiere`, `releve-2024` ou `independant-des-donnees` ;
#   note      facultative, et obligatoire quand deux entrées peuvent être confondues.
#
# ANCRAGE. Le registre s'ancre sur les DONNÉES, non sur un horodatage de
# constitution : c'est l'état de la base auquel les valeurs correspondent, et
# c'est ce qu'une remesure compare d'abord. Un ancrage qui diffère invalide
# toutes les entrées de portée `periode-entiere` sans qu'aucune soit fausse.
#
# CE QUE L'INTÉGRATION CONTINUE NE PEUT PAS PROUVER. L'exécuteur génère une
# fenêtre de trois mois ; ces valeurs sont mesurées sur la période entière.
# Aucune comparaison de valeurs n'y est possible. Voir docs/chiffres/mesurer.py
# et l'enregistrement de décision correspondant.

