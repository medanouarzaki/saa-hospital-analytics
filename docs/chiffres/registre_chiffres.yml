    Échecs de lecture tolérés pendant un rafraîchissement, sous toute charge et sans classe d'erreur
    exceptée. Le critère est ASYMÉTRIQUE : un échec d'échange, lui, est journalisé et relançable. La
    commande est la constante elle-même, faute d'artefact qui la porte ailleurs.
- id: chapitres-numerotes
  valeur: 9
  unite: chapitres
  type: python
  commande: 'len([n for n in __import__(''re'').findall(r''\\input\{chapitres/([a-z0-9-]+)\}'', (R/''report/rapport.tex'').read_text(encoding=''utf-8'')) if __import__(''re'').search(r''\\chapter\{'', (R/''report/chapitres''/(n+''.tex'')).read_text(encoding=''utf-8''))])'
  portee: independant-des-donnees
  note: >-
    Chapitres numérotés du rapport, comptés dans l'ordre des inclusions du fichier principal. Un
    chapitre non numéroté — l'introduction, la conclusion — n'y entre pas.
- id: sections-du-rapport
  valeur: 51
  unite: sections
  type: python
  commande: 'sum(len([l for l in c.read_text(encoding=''utf-8'').splitlines() if l.startswith(''\\section{'')]) for c in sorted((R/''report/chapitres'').glob(''*.tex'')))'
  portee: independant-des-donnees
  note: >-
    Sections numérotées de tous les chapitres. Les sections étoilées de l'introduction et de la
    conclusion n'en sont pas et ne s'y comptent pas.
- id: releve-champs-total
  valeur: 143
  unite: identifiants
  type: python
  commande: 'len(set(__import__(''re'').findall(r''id: (REL-[A-Z]{3}\.[A-Z][0-9]{2})(?![0-9])'', (R/''docs/observation/releve_champs.yml'').read_text(encoding=''utf-8''))))'
  portee: independant-des-donnees
  note: >-
    Éléments relevés au poste, boutons et champs de donnée confondus. Le relevé consigne l'écran tel
    qu'il se présente, et un bouton en fait partie.
- id: releve-champs-non-employes
  valeur: 17
  unite: identifiants
  type: python
  commande: 'len(set(__import__(''re'').findall(r''id: (REL-[A-Z]{3}\.[A-Z][0-9]{2})(?![0-9])'', (R/''docs/observation/releve_champs.yml'').read_text(encoding=''utf-8''))) - set(__import__(''re'').findall(r''REL-[A-Z]{3}\.[A-Z][0-9]{2}(?![0-9])'', chr(10).join(c.read_text(encoding=''utf-8'') for c in sorted((R/''report/chapitres'').glob(''*.tex'')) + [R/''report/correspondance_relations.tex'', R/''report/releve_des_ecrans.tex'']))))'
  portee: independant-des-donnees
  note: >-
    Éléments relevés qu'aucun chapitre ne cite. Tous sont des boutons, aucun n'est un champ de
    donnée : la commande compte les identifiants, et le rapport de travail nomme lesquels.
- id: relations-injectees
  valeur: 21
  unite: relations
  type: python
  commande: 'len(yaml.safe_load((R/''docs/relations_injectees.yml'').read_text(encoding=''utf-8'')))'
  portee: independant-des-donnees
  note: >-
    Relations que le générateur produit par construction, chacune déclarée au registre qui les
    porte.
- id: relations-non-reprises
  valeur: 5
  unite: relations
  type: python
  commande: 'len(__import__(''re'').findall(r''\\relnonreprise\{'', chr(10).join(c.read_text(encoding=''utf-8'') for c in sorted((R/''report/chapitres'').glob(''*.tex'')) + [R/''report/correspondance_relations.tex'', R/''report/releve_des_ecrans.tex''])))'
  portee: independant-des-donnees
  note: >-
    Relations injectées déclarées non reprises par une conclusion, chacune avec son motif. Leur
    somme avec `conclusions-avec-relation` égale `relations-injectees`.
- id: conclusions-avec-relation
  valeur: 16
  unite: relations
  type: python
  commande: 'len(__import__(''re'').findall(r''\\relreprise\{'', chr(10).join(c.read_text(encoding=''utf-8'') for c in sorted((R/''report/chapitres'').glob(''*.tex'')) + [R/''report/correspondance_relations.tex'', R/''report/releve_des_ecrans.tex''])))'
  portee: independant-des-donnees
  note: >-
    Lignes de reprise du tableau de correspondance — une par relation injectée reprise. Une ligne
    peut nommer deux conclusions, et ce décompte compte les RELATIONS, non les conclusions.
- id: conclusions-sans-relation
  valeur: 6
  unite: conclusions
  type: python
  commande: 'len(__import__(''re'').findall(r''\\conclusionhors\{'', chr(10).join(c.read_text(encoding=''utf-8'') for c in sorted((R/''report/chapitres'').glob(''*.tex'')) + [R/''report/correspondance_relations.tex'', R/''report/releve_des_ecrans.tex''])))'
  portee: independant-des-donnees
  note: >-
    Conclusions du chapitre d'analyse déclarées ne venir d'aucune relation injectée. Elles sont un
    effet des autres choix du générateur, et n'établissent rien.
- id: limites-des-faits
  valeur: 4
  unite: limites
  type: python
  commande: 'len([l for l in (R/''docs/decisions/0024-limites-documentees-des-faits.md'').read_text(encoding=''utf-8'').split(''## Décision'')[1].split(''## Justification'')[0].splitlines() if __import__(''re'').match(r''^[0-9]+\. '', l)])'
  portee: independant-des-donnees
  note: >-
    Limites du modèle dimensionnel documentées plutôt que contournées, comptées dans
    l'enregistrement de décision qui les porte. Chacune y dit ce qu'il faudrait pour la lever.
- id: sources-non-citees
  valeur: 12
  unite: sources
  motif_non_emploi: >-
    Mesuré et conservé, mais délibérément absent du rapport. Une entrée du registre des sources
    qu'aucun chapitre ne cite n'est pas une omission : le registre garde ce qu'il a écarté, avec
    le motif de l'écart, et plusieurs de ces entrées portent en toutes lettres « aucun usage » ou
    renvoient à une autre source qui fait foi. Écrire ce décompte en conclusion ferait passer une
    propriété du registre pour une limite du travail.
  type: python
  commande: 'len([s for s in yaml.safe_load((R/''docs/sources/sources.yml'').read_text(encoding=''utf-8'')) if s[''id''].lower().replace(''-'','''') not in {x.strip() for g in __import__(''re'').findall(r''\\cite\{([^}]*)\}'', chr(10).join(c.read_text(encoding=''utf-8'') for c in sorted((R/''report/chapitres'').glob(''*.tex'')))) for x in g.split('','') if x.strip()}])'
  portee: independant-des-donnees
  note: >-
    Entrées du registre des sources qu'aucun chapitre ne cite. Le registre conserve ce qu'il a
    écarté, motif compris : une entrée non citée n'est pas une omission.

# Séries — un jeu de données par entrée, produit par une commande et lu par la composition
#
# MÊME RÈGLE DE PREUVE QUE LES SCALAIRES, ÉTENDUE À CE QUI NE TIENT PAS EN UN NOMBRE. Un graphique
# ou un tableau dont les données seraient tapées dans la source de composition serait exactement ce
# que ce registre existe pour empêcher. Une série est donc une commande, son résultat est un
# fichier de données, et le rapport l'appelle par son identifiant : \serie{identifiant}.
#
# Champs propres aux séries, en plus de ceux d'un scalaire :
#   fichier    chemin du fichier de données, relatif à `report/` ;
#   colonnes   les en-têtes, dans l'ordre — ce que `--formes` confronte à ce que la commande rend ;
#   lignes     le nombre de lignes de données, en-tête exclu ;
#   empreinte  l'empreinte SHA-256 du fichier que la commande produit.
#
# DEUX LIENS, VÉRIFIÉS PAR DEUX CODES DISTINCTS. `mesurer.py --verifier` confronte l'empreinte du
# registre à ce que la COMMANDE produit ; `tests/test_registre_des_chiffres.py` la confronte au
# FICHIER que la composition lit. Retoucher un fichier à la main rompt le second lien ; modifier
# une valeur du registre sans toucher à sa commande rompt le premier.
series:
- id: flux-mensuel
  fichier: figures/flux-mensuel.csv
  colonnes: [annee, programme, urgences]
  lignes: 30
  empreinte: 7dfbfe32216854a206633770a7c3c0378856f636218d1febcb4c99047d8a595e
  type: sql
  commande: |
    select round((extract(year from date_entree) + (extract(month from date_entree) - 1) / 12.0)::numeric, 6) as annee,
      count(*) filter (where type_passage <> 'U') as programme,
      count(*) filter (where type_passage = 'U') as urgences
    from marts.fct_passage group by 1 order by 1
  portee: periode-entiere
  note: >-
    Passages par mois, ventilés entre activité programmée (types C et H de fct_passage) et
    urgences (type U). L'abscisse est l'année décimale — année + (mois - 1) / 12 — pour que l'axe
    porte des graduations d'année sans qu'aucune étiquette de mois ait à être tapée dans la
    source.
- id: flux-horaire
  fichier: figures/flux-horaire.csv
  colonnes: [heure, programme, urgences]
  lignes: 24
  empreinte: 59457ff4efc5436399dc32a7793f0c7b75297801879cd54af7a4bcc1a0dd9059
  type: sql
  commande: |
    select extract(hour from date_heure_entree)::int as heure,
      count(*) filter (where type_passage <> 'U') as programme,
      count(*) filter (where type_passage = 'U') as urgences
    from marts.fct_passage group by 1 order by 1
  portee: periode-entiere
  note: >-
    Passages par heure d'entrée, sur toute la période et non par jour. Mêmes deux populations que
    flux-mensuel. Les effectifs se cumulent sur les 912 jours de la période : ce ne sont pas des
    passages par heure et par jour.
- id: delais-repartition
  fichier: figures/delais-repartition.csv
  colonnes: [jours, artefact, complement]
  lignes: 91
  empreinte: bec3541792ec7264c3ebf4ac76470975c81de98ee44054a1c26e475b9e1636bb
  type: sql
  commande: |
    with p as (select n_ipp, min(date_attribution) as creation from marts.dim_patient group by n_ipp),
    h as (select r.delai_obtention_jours as d, (r.date_prise = p.creation) as art
          from marts.fct_rendez_vous r join p using (n_ipp) where r.est_honore),
    b as (select generate_series(0, 90) as seuil)
    select b.seuil as jours,
      round((100.0 * count(*) filter (where h.art and h.d <= b.seuil) / nullif(count(*) filter (where h.art), 0))::numeric, 4) as artefact,
      round((100.0 * count(*) filter (where not h.art and h.d <= b.seuil) / nullif(count(*) filter (where not h.art), 0))::numeric, 4) as complement
    from b cross join h group by b.seuil order by b.seuil
  portee: periode-entiere
  note: >-
    Part cumulée, en pourcentage, des rendez-vous honorés dont le délai d'obtention ne dépasse pas
    le seuil en abscisse. Deux courbes, sur les deux sous-populations de la partition d'artefact :
    dénominateurs 6 845 et 3 411, jamais 10 256. Les rendez-vous honorés dont la fiche patient est
    en quarantaine en sont exclus, faute de date de création de fiche à laquelle comparer la date
    de prise.
- id: delais-par-activite
  fichier: figures/delais-par-activite.csv
  colonnes: [code, honores, mediane, decile9, complement, mediane_complement, decile9_complement]
  lignes: 8
  empreinte: 3b9b29973fc88cebaba800060abebdcd1aced9dcf5932e6853d1ce8b3937e3fb
  type: sql
  commande: |
    with p as (select n_ipp, min(date_attribution) as creation from marts.dim_patient group by n_ipp),
    h as (select r.code_activite, r.delai_obtention_jours as d, (r.date_prise = p.creation) as art
          from marts.fct_rendez_vous r join p using (n_ipp) where r.est_honore)
    select code_activite as code, count(*) as honores,
      round(percentile_cont(0.5) within group (order by d) filter (where d > 0)::numeric, 1) as mediane,
      round(percentile_cont(0.9) within group (order by d) filter (where d > 0)::numeric, 1) as decile9,
      count(*) filter (where not art) as complement,
      round(percentile_cont(0.5) within group (order by d) filter (where d > 0 and not art)::numeric, 1) as mediane_complement,
      round(percentile_cont(0.9) within group (order by d) filter (where d > 0 and not art)::numeric, 1) as decile9_complement
    from h group by 1 order by 3
  portee: periode-entiere
  note: >-
    Médiane et neuvième décile du délai d'obtention par activité, sur les rendez-vous honorés à
    délai STRICTEMENT POSITIF — population retenue par l'enregistrement de décision sur la
    conformité du délai, le délai nul étant une décision de construction et non un tirage. Les
    colonnes `mediane` et `decile9` portent l'ensemble, les deux dernières le seul complément de
    l'artefact. `honores` et `complement` comptent en revanche tous les honorés, délai nul
    compris.
- id: absenteisme-par-activite
  fichier: figures/absenteisme-par-activite.csv
  colonnes: [code, mediane, absences, mediane_complement, absences_complement]
  lignes: 8
  empreinte: 70e52091a5ede80b8742d3227d7a0cbe08550c788367cb595f7e1ebd5849728e
  type: sql
  commande: |
    with p as (select n_ipp, min(date_attribution) as creation from marts.dim_patient group by n_ipp),
    b as (select r.code_activite, r.delai_obtention_jours::float8 as d, r.est_absence::int::float8 as a,
                 (r.est_honore and r.date_prise = p.creation) as art
          from marts.fct_rendez_vous r join p using (n_ipp)
          where (r.est_honore or r.est_absence) and r.delai_obtention_jours > 0)
    select code_activite as code,
      round(percentile_cont(0.5) within group (order by d)::numeric, 1) as mediane,
      round((100 * avg(a))::numeric, 4) as absences,
      round(percentile_cont(0.5) within group (order by d) filter (where not art)::numeric, 1) as mediane_complement,
      round((100 * avg(a) filter (where not art))::numeric, 4) as absences_complement
    from b group by 1 order by 2
  portee: periode-entiere
  note: >-
    Un point par activité : médiane du délai en abscisse, part des absences en ordonnée.
    Population : rendez-vous honorés ou absents, à délai strictement positif, fiche patient
    présente. La part d'absences du complément a un AUTRE dénominateur que celle de l'ensemble —
    les honorés d'artefact en sont retirés, les absences non — et son niveau n'est donc pas
    comparable ; seule la relation entre les deux colonnes l'est.
- id: urgences-par-niveau
  fichier: figures/urgences-par-niveau.csv
  colonnes: [niveau, passages, part, mediane, decile9]
  lignes: 5
  empreinte: a06468a28dececa25521d101002f1bb7a8e92431a95cd2993c09efa9aa986638
  type: sql
  commande: |
    select niveau_tri::int as niveau, count(*) as passages,
      round((100.0 * count(*) / sum(count(*)) over ())::numeric, 4) as part,
      round(percentile_cont(0.5) within group (order by delai_pec_minutes)::numeric, 1) as mediane,
      round(percentile_cont(0.9) within group (order by delai_pec_minutes)::numeric, 1) as decile9
    from marts.fct_passage_urgence group by 1 order by 1
  portee: periode-entiere
  note: >-
    Passages aux urgences par niveau de tri : effectif, part des passages, médiane et neuvième
    décile du délai avant prise en charge médicale, en minutes. Aucun passage n'est sans délai
    mesuré. Les cinq codes de niveau s'affichent nus : le registre des libellés les classe non
    documentés, la source ne distinguant que trois groupes de gravité là où les données portent
    cinq niveaux.
- id: facturation-par-type
  fichier: figures/facturation-par-type.csv
  colonnes: [episode, factures, montant, part, organisme]
  lignes: 3
  empreinte: be26d50d97ab89d3a8cdae281a7e400ccc71eb3cc8a4e8819c5943136b5fd3e4
  type: sql
  commande: |
    select type_episode as episode, count(*) as factures,
      round(sum(montant_total)::numeric, 2) as montant,
      round((100.0 * sum(montant_total) / sum(sum(montant_total)) over ())::numeric, 4) as part,
      round((100.0 * sum(part_organisme) / sum(montant_total))::numeric, 4) as organisme
    from marts.fct_facturation group by 1 order by 3 desc
  portee: periode-entiere
  note: >-
    Montants facturés par type d'épisode : effectif de factures, montant total, part du montant
    total, et part prise en charge par un organisme rapportée au montant du type. Les trois codes
    s'affichent nus : le registre des libellés les classe non documentés.
- id: anciennete-creances
  fichier: figures/anciennete-creances.csv
  colonnes: [jours, part]
  lignes: 29
  empreinte: 759be86f53523025f88323d2a6895cde86827aa004e42ddbd07eb8c47ec2e207
  type: sql
  commande: |
    with c as (select montant_restant,
                 (select max(date_extraction) from intermediate.int_creances) - date_naissance_creance as age,
                 row_number() over (partition by n_creance order by date_extraction desc) as rg
               from intermediate.int_creances),
    r as (select age, montant_restant from c where rg = 1 and montant_restant > 0),
    b as (select generate_series(0, coalesce((select max(age) from r), 0), 30) as seuil)
    select b.seuil as jours,
      round((100.0 * sum(r.montant_restant) filter (where r.age > b.seuil) / nullif(sum(r.montant_restant), 0))::numeric, 4) as part
    from b cross join r group by b.seuil order by b.seuil
  portee: periode-entiere
  note: >-
    Part du montant restant dû, en pourcentage, porté par des créances plus anciennes que le seuil
    en abscisse. Dénominateur : le montant restant des seules créances dont le restant est
    strictement positif, à leur instantané le plus récent. L'âge se compte depuis la date
    d'extraction la plus récente des créances, et non depuis l'horodatage de l'instantané — celui-
    ci n'est pas peuplé partout où ce registre s'exécute.
- id: qualite-par-table
  fichier: figures/qualite-par-table.csv
  colonnes: [objet, colonnes, incompletes, completude_minimale, quarantaine, taux_quarantaine]
  lignes: 11
  empreinte: 697950363eb698c0cad946a16bf12b7fd50686280cebc373f56f398512454627
  type: sql
  commande: |
    select nom_table as objet, count(*) as colonnes,
      count(*) filter (where taux_completude < 1) as incompletes,
      round((100 * min(taux_completude))::numeric, 4) as completude_minimale,
      max(lignes_quarantaine) as quarantaine,
      round((100 * max(taux_quarantaine))::numeric, 4) as taux_quarantaine
    from marts.agg_qualite_donnees group by 1 order by 6 desc, 1
  portee: periode-entiere
  note: >-
    Par table de la couche intermédiaire : nombre de colonnes, nombre de colonnes incomplètes,
    complétude de la colonne la moins renseignée, lignes mises en quarantaine et taux de
    quarantaine. Le taux de quarantaine est celui de la table, identique sur toutes ses colonnes :
    `max` l'extrait sans le sommer.
- id: completude-champs
  fichier: figures/completude-champs.csv
  colonnes: [rang, completude]
  lignes: 43
  empreinte: a45e99e94440ddbfe954533ddd4f309136e900ac3268b067365bfd1f765b8db6
  type: sql
  commande: |
    select row_number() over (order by taux_completude, nom_table, colonne) as rang,
      round((100 * taux_completude)::numeric, 4) as completude
    from marts.agg_qualite_donnees where taux_completude < 1 order by rang
  portee: periode-entiere
  note: >-
    Taux de renseignement des seules colonnes incomplètes, rangées par ordre croissant. L'abscisse
    est un rang, non un identifiant de colonne : la courbe donne la FORME de la distribution, et
    le rapport nomme dans sa prose les colonnes des deux extrémités.
- id: tableau-de-bord-par-page
  fichier: figures/tableau-de-bord-par-page.csv
  colonnes: [page, section, indicateurs, graphiques]
  lignes: 9
  empreinte: 0ba7b302881861a1a90787ba979286e8a706cd49da68389c5f037ce0580710df
  type: python
  commande: '[(p, [e[''section''] for e in yaml.safe_load((R/''dashboard/indicateurs.yml'').read_text(encoding=''utf-8''))[''indicateurs''] if e[''page'']==p][0], len([e for e in yaml.safe_load((R/''dashboard/indicateurs.yml'').read_text(encoding=''utf-8''))[''indicateurs''] if e[''page'']==p]), sum((R/''dashboard/pages''/(p+''.py'')).read_text(encoding=''utf-8'').count(g) for g in (''st.line_chart'',''st.bar_chart'',''st.area_chart'',''st.scatter_chart'',''rendu.tracer_temporel''))) for p in yaml.safe_load((R/''dashboard/indicateurs.yml'').read_text(encoding=''utf-8''))[''pages'']]'
  portee: independant-des-donnees
  note: >-
    Une ligne par page du tableau de bord, dans l'ordre du registre des indicateurs : sa section,
    le nombre d'indicateurs qu'elle porte et le nombre de tracés que son fichier appelle. La
    section est celle de ses indicateurs, aucune page n'en portant des deux.
- id: instantane-objets
  fichier: figures/instantane-objets.csv
  colonnes: [rang, lignes]
  lignes: 24
  empreinte: c061d3486a24ba6bdbc2c67edda07fad2a42b176acbb3aada3ad30416ab07287
  type: sql
  commande: |
    select row_number() over (order by lignes desc, objet) as rang, lignes
    from instantane.instantane_etat order by rang
  portee: periode-entiere
  note: >-
    Lignes copiées par objet de l'instantané, rangées par effectif décroissant. L'abscisse est un
    rang, non un nom d'objet : la courbe donne la FORME de la distribution, et la prose nomme les
    objets des deux extrémités. Les deux tables de service n'y figurent pas — la table d'état ne
    se décrit pas elle-même.
- id: exigences-restitution
  fichier: figures/exigences-restitution.csv
  colonnes: [indicateur, classement, tables, champ]
  lignes: 16
  empreinte: b31f1efaedc0f9ee7c7664e454bfcaf465e89d05552f03fed26a910980bb6cea
  separateur: tabulation
  type: python
  commande: '[tuple(c.strip().replace(''**'','''').replace(chr(96),'''').replace(''*'','''') for c in (l.split(''|'')[1], l.split(''|'')[3], l.split(''|'')[4], l.split(''|'')[5])) for l in (R/''docs/exigences_statistiques.md'').read_text(encoding=''utf-8'').split(''| indicateur | définition en une ligne |'')[1].split(chr(10)+chr(10))[0].splitlines()[2:]]'
  portee: independant-des-donnees
  note: >-
    Le tableau de correspondance avec la nomenclature nationale, lu dans le document qui le porte
    et jamais recopié : indicateur, classement, tables mobilisées, champ manquant. Le séparateur
    est la tabulation, les cellules portant virgules et points-virgules. Les marques de mise en
    forme du document sont retirées, son texte ne l'est pas.
