- id: tom-affiche
  valeur: 53.3639
  unite: '%'
  type: sql
  commande: >-
    select round((with p as (select max(valeur::numeric) filter (where
    nom='capacite_litiere_fonctionnelle') as capacite, max(valeur::numeric) filter (where
    nom='jours_annee_reference') as jours_annee, max(valeur::numeric) filter (where
    nom='nombre_jours_periode') as jours_periode from instantane.instantane_parametres), b as
    (select (select max(date_reference_donnees) from instantane.instantane_etat) as censure), m as
    (select sum(extract(epoch from (coalesce(date_heure_sortie, ((select censure from b) + time
    '23:59:59') at time zone 'UTC') - date_heure_admission)) / 86400.0) as journees from
    instantane.fct_sejour) select 100 * (select journees from m) * (select jours_annee from p) /
    (select jours_periode from p) / ((select jours_annee from p) * (select capacite from
    p)))::numeric, 4)
  portee: periode-entiere
  note: >-
    Taux d'occupation moyen TEL QUE LA PAGE L'AFFICHE : requête rejouée sur le schéma d'instantané,
    séjours non clos censurés à la date de référence, annualisation sur la période déclarée. À
    confronter à tom-publie, non à une seconde écriture de la même formule.
- id: dms-affichee
