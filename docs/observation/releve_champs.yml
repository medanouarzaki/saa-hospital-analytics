# Relevé de champs — observation au poste de travail, profil MSM - GESTION DE RDV
#
# Deux conventions de lecture :
#
# 1. Le caractère obligatoire ou facultatif d'un champ n'a été relevé sur aucun
#    écran. Il n'est donc affirmé nulle part : tous les champs de saisie
#    portent `non_determine`. Une valeur binaire imposée ici produirait cent
#    quarante-trois affirmations non observées.
#
# 2. `sans_objet` désigne un élément qui n'est pas un champ de saisie de
#    dossier : bouton d'action, onglet, entrée de menu, libellé de profil,
#    colonne de résultat, filtre de recherche.

