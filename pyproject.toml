[project]
name = "saa-hospital-analytics"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "pyyaml",
    "pandas",
    "pyarrow",
    "faker",
    "psycopg[binary]",
    "sqlalchemy",
    "openpyxl",
    "streamlit",
    "splink",
    "dbt-postgres>=1.11.0",
]

[dependency-groups]
dev = [
    "apache-airflow==3.3.0",
    "pytest",
    "ruff",
    "sqlfluff",
]
dbt = [
    "dbt-core",
    "dbt-postgres",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
